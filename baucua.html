<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bầu Cua Tôm Cá — Trung Tâm Giải Trí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-color:#060f1e;
  --panel-bg:rgba(15,23,42,.7);
  --gold:#d4af37;
  --gold-glow:rgba(212,175,55,.4);
  --blue-accent:#3b82f6;
  --blue-glow:rgba(59,130,246,.3);
  --text-main:#f8fafc;
  --text-muted:#94a3b8;
  --danger:#f43f5e;
  --success:#10b981;
  --border-color:rgba(255,255,255,.08);
}
body{
  font-family:'Montserrat',sans-serif;
  background:radial-gradient(circle at 50% -20%,#1e3a8a 0%,var(--bg-color) 80%);
  color:var(--text-main);display:flex;flex-direction:column;align-items:center;
  min-height:100vh;margin:0;padding:20px;box-sizing:border-box;
  user-select:none;overflow-x:hidden;
}
.glass-panel{
  background:var(--panel-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border-color);border-radius:16px;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}
/* ---- HUB ---- */
.navbar{
  width:100%;max-width:1200px;display:flex;justify-content:space-between;align-items:center;
  gap:12px;flex-wrap:wrap;padding:14px 26px;margin-bottom:28px;box-sizing:border-box;
}
.nav-left{display:flex;align-items:center;gap:12px}
.btn-back{
  display:flex;align-items:center;gap:8px;color:var(--text-muted);text-decoration:none;
  font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;
  transition:.3s;cursor:pointer;border:1px solid var(--border-color);
  padding:9px 16px;border-radius:10px;
}
.btn-back svg{width:15px;height:15px}
.btn-back:hover{color:var(--gold);border-color:var(--gold)}
.nav-title{font-size:12px;letter-spacing:4px;color:rgba(255,255,255,.45);font-weight:800}
.nav-right{display:flex;align-items:center;gap:12px}
.icon-btn{
  width:42px;height:42px;border-radius:10px;border:1px solid rgba(59,130,246,.5);
  background:rgba(59,130,246,.1);color:var(--blue-accent);display:grid;place-items:center;
  cursor:pointer;transition:.25s;
}
.icon-btn:hover{background:var(--blue-accent);color:#fff}
.icon-btn svg{width:18px;height:18px}
#sound-btn .off{display:none}
#sound-btn.muted .on{display:none}
#sound-btn.muted .off{display:block}
#sound-btn.muted{opacity:.55;border-color:rgba(255,255,255,.2);color:rgba(255,255,255,.4)}
.balance-box{
  display:flex;align-items:center;gap:9px;color:var(--gold);font-size:22px;
  font-family:'Roboto Mono',monospace;font-weight:700;text-shadow:0 0 15px var(--gold-glow);
  background:rgba(0,0,0,.3);padding:8px 18px;border-radius:10px;border:1px solid var(--border-color);
}
.balance-box svg{width:19px;height:19px;flex:none}
/* ---- MAIN ---- */
.main-container{display:flex;gap:30px;width:100%;max-width:1200px;align-items:flex-start;justify-content:center}
.game-area{display:flex;flex-direction:column;align-items:center;flex-grow:1;max-width:800px}
.status-board{width:100%;padding:18px 30px;text-align:center;margin-bottom:22px;box-sizing:border-box;border-top:2px solid var(--blue-accent)}
.status-text{font-size:19px;letter-spacing:4px;text-transform:uppercase;font-weight:800;margin-bottom:14px;color:var(--gold)}
.timer-wrapper{display:flex;align-items:center;gap:15px;width:100%}
.timer-bar-bg{flex-grow:1;height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.timer-bar-fill{height:100%;width:100%;background:var(--blue-accent);box-shadow:0 0 10px var(--blue-accent);transition:width 1s linear}
.timer-number{font-size:17px;font-family:'Roboto Mono',monospace;font-weight:700;width:42px;text-align:right}
.dice-container{
  display:flex;gap:20px;margin-bottom:30px;padding:24px 50px;
  background:radial-gradient(circle,var(--blue-glow) 0%,transparent 80%);
  border:1px solid rgba(59,130,246,.2);
}
.dice{
  width:85px;height:85px;background:#fff;border-radius:12px;display:flex;
  justify-content:center;align-items:center;font-size:55px;
  box-shadow:inset 0 0 15px rgba(0,0,0,.2),0 10px 20px rgba(0,0,0,.5);transition:transform .1s;
}
.dice.shake{animation:shake .12s infinite}
@keyframes shake{0%{transform:translate(2px,2px)}50%{transform:translate(-2px,-2px)}100%{transform:translate(2px,-2px)}}
.dice.landed{animation:land .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.chip-selector{display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap;justify-content:center}
.chip{
  background:rgba(0,0,0,.5);color:var(--text-muted);border:1px solid var(--border-color);
  padding:12px 24px;border-radius:50px;font-size:16px;font-family:'Roboto Mono',monospace;
  font-weight:700;cursor:pointer;transition:.3s;
}
.chip.active{background:var(--gold);color:#000;border-color:var(--gold);box-shadow:0 0 20px var(--gold-glow);transform:translateY(-4px)}
.chip:hover:not(.locked):not(.active){border-color:var(--blue-accent);color:#fff}
.betting-board{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;width:100%;margin-bottom:26px}
.bet-cell{
  background:rgba(15,23,42,.5);border:1px solid var(--border-color);border-radius:12px;
  padding:24px 15px;text-align:center;cursor:pointer;position:relative;transition:.2s;
}
.bet-cell:hover:not(.locked){border-color:var(--blue-accent);background:rgba(59,130,246,.05)}
.bet-cell.has-bet{border-color:var(--gold);background:rgba(212,175,55,.08);box-shadow:inset 0 0 15px rgba(212,175,55,.05)}
.bet-cell.win-cell{
  border-color:var(--gold);background:rgba(212,175,55,.16);
  box-shadow:0 0 22px var(--gold-glow),inset 0 0 20px rgba(212,175,55,.1);
  animation:winCell .9s infinite alternate;
}
@keyframes winCell{from{transform:scale(1)}to{transform:scale(1.03)}}
.cell-icon{font-size:55px;margin-bottom:12px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.cell-name{font-size:15px;text-transform:uppercase;font-weight:700;letter-spacing:1px;color:var(--text-muted);margin-bottom:14px}
.bet-amount{
  background:#000;color:var(--gold);padding:6px 14px;border-radius:6px;
  font-family:'Roboto Mono',monospace;font-size:14px;display:inline-block;min-width:52px;
  font-weight:700;border:1px solid rgba(212,175,55,.2);
}
.locked{pointer-events:none;opacity:.5;filter:grayscale(50%)}
.controls{display:flex;gap:15px;width:100%;justify-content:flex-end}
.btn-clear{
  padding:12px 30px;font-size:13px;font-family:'Montserrat',sans-serif;font-weight:700;
  border:1px solid var(--border-color);border-radius:8px;cursor:pointer;text-transform:uppercase;
  transition:.3s;background:rgba(244,63,94,.1);color:var(--danger);letter-spacing:1px;
}
.btn-clear:hover:not(:disabled){background:var(--danger);color:#fff;border-color:var(--danger)}
.btn-clear:disabled{background:transparent;color:#444;border-color:#222;cursor:not-allowed}
/* ---- SOI CẦU ---- */
.sidebar-history{width:360px;flex-shrink:0}
.history-board{padding:25px;height:100%;box-sizing:border-box;border-left:2px solid var(--blue-accent)}
.history-title{font-size:17px;color:var(--gold);margin-bottom:22px;letter-spacing:2px;text-transform:uppercase;font-weight:800;text-align:center}
.history-list{display:flex;flex-direction:column;gap:14px;max-height:520px;overflow-y:auto;padding-right:10px}
.history-list::-webkit-scrollbar{width:4px}
.history-list::-webkit-scrollbar-thumb{background:var(--blue-accent);border-radius:5px}
.history-item{
  padding:16px 24px;border-radius:12px;font-size:27px;background:rgba(0,0,0,.4);
  border:1px solid rgba(255,255,255,.05);display:flex;justify-content:center;align-items:center;
  animation:fadeIn .4s ease;transition:.3s;
}
.history-item.latest{border-color:var(--gold);box-shadow:0 0 15px var(--gold-glow);background:rgba(212,175,55,.1)}
@keyframes fadeIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
/* ---- POPUP ---- */
.result-overlay{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  background:rgba(6,15,30,.85);backdrop-filter:blur(10px);
  display:flex;justify-content:center;align-items:center;
  z-index:10000;opacity:0;pointer-events:none;transition:.3s ease;
}
.result-overlay.active{opacity:1;pointer-events:all}
.result-modal{
  background:linear-gradient(135deg,#0f172a 0%,#060f1e 100%);
  border:2px solid var(--gold);border-radius:24px;padding:40px 60px;text-align:center;
  transform:scale(.8);transition:.3s cubic-bezier(.175,.885,.32,1.275);
  box-shadow:0 30px 60px rgba(0,0,0,.8),inset 0 0 30px rgba(59,130,246,.1);
}
.result-overlay.active .result-modal{transform:scale(1)}
.result-title{font-size:38px;margin:0 0 20px;text-transform:uppercase;letter-spacing:4px;font-weight:800}
.result-title.win{color:var(--success);text-shadow:0 0 25px rgba(16,185,129,.5)}
.result-title.lose{color:var(--danger);text-shadow:0 0 25px rgba(244,63,94,.5)}
.result-dice-display{display:flex;gap:20px;justify-content:center;font-size:62px;margin-bottom:24px;filter:drop-shadow(0 5px 15px rgba(0,0,0,.6))}
.result-money{font-size:36px;font-family:'Roboto Mono',monospace;font-weight:700;margin-bottom:18px}
.result-money.win{color:var(--success)}
.result-money.lose{color:var(--danger)}
.result-hint{font-size:13px;color:var(--text-muted);font-style:italic;opacity:.6}
/* ---- TOAST ---- */
.toast-container{position:fixed;bottom:30px;right:30px;display:flex;flex-direction:column;gap:10px;z-index:9999}
.toast{
  background:rgba(15,23,42,.98);border-left:4px solid var(--blue-accent);padding:14px 24px;
  border-radius:8px;color:#fff;font-size:15px;font-weight:600;
  box-shadow:0 10px 30px rgba(0,0,0,.6);transform:translateX(120%);transition:.4s;
  border-top:1px solid var(--border-color);border-bottom:1px solid var(--border-color);border-right:1px solid var(--border-color);
}
.toast.show{transform:translateX(0)}
@media(max-width:950px){
  .main-container{flex-direction:column;align-items:center;gap:20px}
  .sidebar-history{width:100%;max-width:800px;order:2}
  .history-list{flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:10px}
  .history-item{font-size:22px;padding:10px 20px}
  .game-area{width:100%;order:1}
  .betting-board{grid-template-columns:repeat(2,1fr)}
  .dice{width:65px;height:65px;font-size:40px}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

<!-- HUB -->

      <div class="bet-cell glass-panel" data-animal="cua"><div class="cell-icon">🦀</div><div class="cell-name">Cua</div><div class="bet-amount" id="bet-cua">0</div></div>
      <div class="bet-cell glass-panel" data-animal="tom"><div class="cell-icon">🦐</div><div class="cell-name">Tôm</div><div class="bet-amount" id="bet-tom">0</div></div>

<script>
/* ============ VÍ TIỀN CHUNG (key "userBalance") ============ */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const fmt = n => Math.round(n).toLocaleString('vi-VN');
const wallet = {
  bal: 0, shown: 0, anim: null, el: $('#global-balance'),
  load(){
    const v = parseInt(String(localStorage.getItem('userBalance')||'').replace(/[.,\s]/g,''));
    this.bal = isNaN(v) ? 5000000 : v; this.render();
  },
  render(){ this.el.textContent = fmt(this.bal); this.shown = this.bal },
  set(v){
    this.bal = Math.max(0, Math.round(v));
    localStorage.setItem('userBalance', this.bal);
    if(this.anim) cancelAnimationFrame(this.anim);
    const from = this.shown, to = this.bal, t0 = performance.now();
    const step = t => { const p = Math.min(1,(t-t0)/650), e = 1-Math.pow(1-p,3);
      this.shown = Math.round(from+(to-from)*e); this.el.textContent = fmt(this.shown);
      if(p<1) this.anim = requestAnimationFrame(step); else this.anim = null };
    this.anim = requestAnimationFrame(step);
  },
  add(v){ this.set(this.bal + v) }
};
wallet.load();
addEventListener('storage', e => { if(e.key === 'userBalance') wallet.load() });

/* ============ ÂM THANH (WebAudio, chung khóa "muted") ============ */
const sound = {
  muted: localStorage.getItem('muted') === '1', ctx: null,
  ac(){ try{
    if(!this.ctx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; this.ctx = new C() }
    if(this.ctx.state === 'suspended'){ this.ctx.resume().catch(()=>{}) }
    return this.ctx;
  }catch(e){ return null } },
  tone(f, dur=.1, type='sine', vol=.06, when=0, slide=0){
    if(this.muted) return; const c = this.ac(); if(!c) return;
    try{
      const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f+slide), t+dur);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.012);
      g.gain.exponentialRampToValueAtTime(.0001, t+dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
    }catch(e){}
  },
  click(){ this.tone(720,.05,'triangle',.05) },
  chip(){ this.tone(520,.06,'triangle',.05); this.tone(780,.05,'triangle',.04,.05) },
  tick(){ this.tone(1050,.05,'triangle',.05) },
  rattle(){ this.tone(900+Math.random()*600,.04,'square',.02) },
  land(){ this.tone(150,.12,'sine',.08,0,-60); this.tone(1250,.07,'triangle',.05,.08) },
  win(){ [523,659,784,1046].forEach((f,i)=>this.tone(f,.14,'sine',.07,i*.09));
    for(let i=0;i<8;i++) this.tone(1600+Math.random()*600,.05,'triangle',.035,.5+Math.random()*.6) },
  lose(){ this.tone(240,.2,'sine',.045,0,-100) }
};
function syncSndBtn(){ $('#sound-btn').classList.toggle('muted', sound.muted) }
syncSndBtn();
 $('#sound-btn').addEventListener('click', () => {
  sound.muted = !sound.muted;
  try{ localStorage.setItem('muted', sound.muted ? '1' : '0') }catch(e){}
  syncSndBtn();
  if(!sound.muted) sound.click();
});
addEventListener('storage', e => {
  if(e.key === 'muted'){ sound.muted = e.newValue === '1'; syncSndBtn() }
});

/* ============ DỮ LIỆU GAME ============ */
const ANIMALS = ['bau','cua','tom','ca','ga','nai'];
const EMOJIS = { bau:'🍐', cua:'🦀', tom:'🦐', ca:'🐟', ga:'🐓', nai:'🦌' };
const PHASES = {
  BETTING: { time:30, name:'XIN MỜI ĐẶT CƯỢC',   color:'var(--gold)' },
  ROLLING: { time:5,  name:'ĐANG LẮC XÍ NGẦU',    color:'var(--blue-accent)' },
  RESULT:  { time:6,  name:'KẾT QUẢ PHIÊN',       color:'var(--success)' }
};

let currentState = 'BETTING', timeLeft = PHASES.BETTING.time;
let currentChip = 10000;
let bets = { bau:0, cua:0, tom:0, ca:0, ga:0, nai:0 };
let rollInterval = null, rattleTimer = null, popupTimeout = null;
let gameHistory = [];
try{ gameHistory = JSON.parse(localStorage.getItem('baucua_history') || '[]') }catch(e){ gameHistory = [] }

/* ============ LỊCH SỬ ============ */
function renderHistory(){
  const list = $('#history-list');
  if(!gameHistory.length){
    list.innerHTML = `<div id="empty-history" style="color:var(--text-muted);font-size:14px;text-align:center;padding:40px 0;font-style:italic">Đang chờ dữ liệu...</div>`;
    return;
  }
  list.innerHTML = gameHistory.map((r, idx) =>
    `<div class="history-item${idx === 0 ? ' latest' : ''}"><span>${EMOJIS[r[0]]} ${EMOJIS[r[1]]} ${EMOJIS[r[2]]}</span></div>`
  ).join('');
}
function updateHistory(res){
  gameHistory.unshift(res);
  if(gameHistory.length > 15) gameHistory.pop();
  try{ localStorage.setItem('baucua_history', JSON.stringify(gameHistory)) }catch(e){}
  renderHistory();
}
renderHistory();

/* ============ TOAST ============ */
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  $('#toast-container').appendChild(t);
  setTimeout(() => t.classList.add('show'), 10);
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400) }, 2500);
}

/* ============ VÒNG VÁN ============ */
setInterval(() => {
  timeLeft--;
  updateTimerUI();
  if(currentState === 'BETTING' && timeLeft <= 3 && timeLeft > 0) sound.tick();
  if(timeLeft <= 0) switchPhase();
}, 1000);

function switchPhase(){
  if(currentState === 'BETTING'){
    currentState = 'ROLLING';
    timeLeft = PHASES.ROLLING.time;
    lockBoard(true);
    startRollingEffect();
    showToast('Hết thời gian cược!');
  }
  else if(currentState === 'ROLLING'){
    currentState = 'RESULT';
    timeLeft = PHASES.RESULT.time;
    stopRollingAndShowResult();
  }
  else if(currentState === 'RESULT'){
    currentState = 'BETTING';
    timeLeft = PHASES.BETTING.time;
    resetTable();
    lockBoard(false);
    closeResultPopup();
  }
  updateTimerUI();
}

function updateTimerUI(){
  $('#status-text').textContent = PHASES[currentState].name;
  $('#status-text').style.color = PHASES[currentState].color;
  const pct = Math.max(0, (timeLeft / PHASES[currentState].time) * 100);
  const fill = $('#timer-fill');
  fill.style.width = pct + '%';
  fill.style.backgroundColor = (currentState === 'BETTING' && timeLeft <= 10) ? 'var(--danger)' : PHASES[currentState].color;
  $('#timer-num').textContent = Math.max(0, timeLeft) + 's';
}

function lockBoard(isLocked){
  ['betting-board','chip-selector','btn-clear'].forEach(id =>
    document.getElementById(id).classList.toggle('locked', isLocked));
}

function resetTable(){
  bets = { bau:0, cua:0, tom:0, ca:0, ga:0, nai:0 };
  [1,2,3].forEach(n => {
    const d = document.getElementById('dice-' + n);
    d.textContent = '?';
    d.classList.remove('landed');
  });
  $$('.bet-cell').forEach(c => c.classList.remove('win-cell'));
  updateBoardUI();
}

/* ============ LẮC & KẾT QUẢ ============ */
function startRollingEffect(){
  const dice = [1,2,3].map(n => document.getElementById('dice-' + n));
  dice.forEach(d => d.classList.add('shake'));
  rollInterval = setInterval(() => {
    dice.forEach(d => d.textContent = EMOJIS[ANIMALS[Math.floor(Math.random()*6)]]);
  }, 80);
  rattleTimer = setInterval(() => sound.rattle(), 95);
}

function stopRollingAndShowResult(){
  clearInterval(rollInterval);
  if(rattleTimer){ clearInterval(rattleTimer); rattleTimer = null }
  const dice = [1,2,3].map(n => document.getElementById('dice-' + n));
  dice.forEach(d => { d.classList.remove('shake'); d.classList.add('landed') });
  const res = [0,0,0].map(() => ANIMALS[Math.floor(Math.random()*6)]);
  dice.forEach((d, i) => d.textContent = EMOJIS[res[i]]);
  sound.land();

  /* ô trúng phát sáng */
  res.forEach(a => document.querySelector(`.bet-cell[data-animal="${a}"]`).classList.add('win-cell'));

  calculatePayout(res);
  updateHistory(res);          /* luôn cập nhật soi cầu, kể cả khi không cược */
}

function calculatePayout(results){
  const totalBet = Object.values(bets).reduce((a, b) => a + b, 0);
  if(totalBet === 0) return;

  const counts = {};
  results.forEach(a => counts[a] = (counts[a] || 0) + 1);
  let totalPayout = 0;
  for(const a in bets){
    if(bets[a] > 0 && counts[a]) totalPayout += bets[a] + bets[a] * counts[a];
  }
  if(totalPayout > 0){ wallet.add(totalPayout); sound.win() }
  else { sound.lose() }
  showResultPopup(totalPayout, totalBet, results);
}

function showResultPopup(payout, bet, res){
  $('#result-dice-display').innerHTML = `${EMOJIS[res[0]]} ${EMOJIS[res[1]]} ${EMOJIS[res[2]]}`;
  const title = $('#result-title'), money = $('#result-money-text');
  if(payout > 0){
    title.textContent = 'THẮNG LỚN';
    title.className = 'result-title win';
    money.className = 'result-money win';
    money.textContent = '+' + fmt(payout) + 'đ';
  } else {
    title.textContent = 'RẤT TIẾC';
    title.className = 'result-title lose';
    money.className = 'result-money lose';
    money.textContent = '-' + fmt(bet) + 'đ';
  }
  $('#result-overlay').classList.add('active');
  clearTimeout(popupTimeout);
  popupTimeout = setTimeout(closeResultPopup, 3000);
}
function closeResultPopup(){
  $('#result-overlay').classList.remove('active');
  clearTimeout(popupTimeout);
}
 $('#result-overlay').addEventListener('click', closeResultPopup);

/* ============ CƯỢC ============ */
 $$('.chip').forEach(c => c.addEventListener('click', () => {
  if(currentState !== 'BETTING') return;
  $$('.chip').forEach(x => x.classList.remove('active'));
  c.classList.add('active');
  currentChip = +c.dataset.val;
  sound.click();
}));

 $$('.bet-cell').forEach(cell => cell.addEventListener('click', () => {
  if(currentState !== 'BETTING') return showToast('Bàn cược đang đóng!');
  if(wallet.bal < currentChip) return showToast('Không đủ số dư — về Trang Chủ bốc Bát Họ!');
  wallet.add(-currentChip);
  bets[cell.dataset.animal] += currentChip;
  updateBoardUI();
  sound.chip();
}));

 $('#btn-clear').addEventListener('click', () => clearBets(true));

function clearBets(showMsg){
  if(currentState !== 'BETTING') return;
  const refund = Object.values(bets).reduce((a, b) => a + b, 0);
  if(refund > 0){
    wallet.add(refund);
    bets = { bau:0, cua:0, tom:0, ca:0, ga:0, nai:0 };
    updateBoardUI();
    if(showMsg){ showToast('Đã hoàn tác: +' + fmt(refund) + 'đ'); sound.chip() }
  }
}

function updateBoardUI(){
  for(const a in bets){
    const el = document.getElementById('bet-' + a);
    el.textContent = bets[a] > 0
      ? (bets[a] >= 1000000 ? (bets[a]/1000000)+'M' : (bets[a]/1000)+'K')
      : '0';
    el.parentElement.classList.toggle('has-bet', bets[a] > 0);
  }
}

/* ============ THOÁT AN TOÀN ============ */
 $('#btn-back-lobby').addEventListener('click', e => {
  if(currentState === 'BETTING') clearBets(false);   /* hoàn cược trước khi về */
});
addEventListener('beforeunload', () => {
  if(currentState === 'BETTING') clearBets(false);
});
</script>
