<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tài Xỉu — Trung Tâm Giải Trí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-color:#0c1831; --card-bg:#14213d; --accent:#00d2ff;
  --success:#2ecc71; --gold:#f1c40f; --tai:#ff4757;
}
*{box-sizing:border-box}
body{
  font-family:'Oswald',sans-serif;background-color:var(--bg-color);color:#fff;
  display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;
  padding:16px;user-select:none;overflow:hidden;
  background-image:radial-gradient(circle at 50% 0%,#14213d 0%,#0c1831 60%);
}
.casino-modal{
  position:relative;width:1100px;min-height:640px;
  background:var(--card-bg);border:4px solid var(--accent);border-radius:36px;
  box-shadow:0 0 50px rgba(0,210,255,.35),inset 0 0 20px rgba(0,210,255,.1);
  display:flex;flex-direction:column;overflow:visible;z-index:1;
  transform-origin:center center;
}
#fx{position:absolute;inset:0;pointer-events:none;z-index:500}
/* ---- TOP BAR HUB ---- */
.top-bar{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 22px;border-bottom:2px solid rgba(0,210,255,.2);
  background:rgba(0,0,0,.3);border-radius:32px 32px 0 0;
}
.tb-left,.tb-right{display:flex;align-items:center;gap:10px}
.tb-btn{
  display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.5);color:var(--accent);
  border:2px solid rgba(0,210,255,.5);padding:8px 16px;border-radius:10px;
  font-family:'Oswald';font-weight:600;font-size:14px;letter-spacing:2px;
  text-decoration:none;cursor:pointer;transition:.25s;
}
.tb-btn svg{width:15px;height:15px}
.tb-btn:hover{background:var(--accent);color:#04202b;box-shadow:0 0 14px rgba(0,210,255,.5)}
#sound-btn .off{display:none}
#sound-btn.muted .on{display:none}
#sound-btn.muted .off{display:block}
#sound-btn.muted{color:rgba(255,255,255,.4);border-color:rgba(255,255,255,.2)}
.tb-title{font-size:15px;letter-spacing:4px;color:rgba(255,255,255,.55);font-weight:600}
.balance-box{
  display:flex;align-items:center;gap:9px;padding:8px 18px;border-radius:12px;
  border:2px solid rgba(241,196,15,.5);background:rgba(0,0,0,.5);
  font-family:'Roboto Mono',monospace;font-weight:700;font-size:19px;color:var(--gold);
  text-shadow:0 0 10px rgba(241,196,15,.4);white-space:nowrap;
}
.balance-box svg{width:20px;height:20px;flex:none}
/* ---- STATUS ---- */
.status-bar{
  text-align:center;padding:12px;font-size:19px;text-transform:uppercase;letter-spacing:3px;
  background:rgba(0,210,255,.1);border-bottom:2px solid rgba(0,210,255,.1);transition:all .3s;
}
@keyframes flash-red{0%,100%{color:#fff;text-shadow:none}50%{color:var(--tai);text-shadow:0 0 15px var(--tai)}}
.flash-red{animation:flash-red 1.2s infinite ease-in-out}
@keyframes flash-yellow{0%,100%{color:#fff;text-shadow:none}50%{color:var(--gold);text-shadow:0 0 15px var(--gold)}}
.flash-yellow{animation:flash-yellow 1.2s infinite ease-in-out}
@keyframes flash-green{0%,100%{color:#fff;text-shadow:none}50%{color:var(--success);text-shadow:0 0 15px var(--success)}}
.flash-green{animation:flash-green 1.2s infinite ease-in-out}
/* ---- KHU CHƠI ---- */
.play-area{flex:1;display:flex;justify-content:space-around;align-items:center;padding:26px 20px;position:relative}
.side{
  width:220px;height:220px;display:flex;justify-content:center;align-items:center;
  text-align:center;cursor:pointer;transition:.3s;opacity:.2;border-radius:40px;border:4px solid transparent;
}
.side.selected{opacity:1;transform:scale(1.1);background:rgba(0,210,255,.05)}
.side-title{font-size:150px;font-weight:900;color:#fff;-webkit-text-stroke:1.5px var(--accent);text-shadow:0 0 20px var(--accent);line-height:1}
.win-active{animation:blink-victory .8s infinite !important;opacity:1 !important}
@keyframes blink-victory{
  0%{background:rgba(241,196,15,.15);border-color:rgba(241,196,15,.5);box-shadow:0 0 10px rgba(241,196,15,.4);filter:brightness(1)}
  50%{background:rgba(241,196,15,.4);border-color:var(--gold);box-shadow:0 0 40px var(--gold),inset 0 0 15px rgba(255,255,255,.2);filter:brightness(1.15)}
  100%{background:rgba(241,196,15,.15);border-color:rgba(241,196,15,.5);box-shadow:0 0 10px rgba(241,196,15,.4);filter:brightness(1)}
}
.win-active .side-title{color:var(--gold) !important;-webkit-text-stroke:2px #fff;text-shadow:0 0 20px #fff}
.bowl-center{
  position:relative;width:210px;height:210px;background:#222;border-radius:50%;border:6px solid #333;
  display:flex;justify-content:center;align-items:center;box-shadow:inset 0 0 50px rgba(0,0,0,.9);z-index:100;
}
.dice-container{position:relative;width:125px;height:115px}
.dice{
  position:absolute;width:55px;height:55px;background:#fff;border-radius:12px;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:7px;gap:0;
  box-shadow:inset -3px -3px 8px rgba(0,0,0,.2),0 5px 10px rgba(0,0,0,.5);
  place-items:center;
}
.dice .q{grid-column:1/4;grid-row:1/4;font-size:30px;font-weight:900;color:#555}
.dice .pip{width:9px;height:9px;border-radius:50%;background:#16181f;align-self:center;justify-self:center}
.dice .pip:nth-child(1){grid-area:1/1}.dice .pip:nth-child(2){grid-area:1/2}.dice .pip:nth-child(3){grid-area:1/3}
.dice .pip:nth-child(4){grid-area:2/1}.dice .pip:nth-child(5){grid-area:2/2}.dice .pip:nth-child(6){grid-area:2/3}
.dice .pip:nth-child(7){grid-area:3/1}.dice .pip:nth-child(8){grid-area:3/2}.dice .pip:nth-child(9){grid-area:3/3}
#d1{top:0;left:50%;transform:translateX(-50%)}#d2{bottom:0;left:0}#d3{bottom:0;right:0}
#plate{
  position:absolute;width:225px;height:225px;
  background:radial-gradient(circle at 40% 40%,#3b3b3b 0%,#1a1a1a 60%,#050505 100%);
  border-radius:50%;z-index:150;cursor:grab;border:2px solid #222;
  box-shadow:0 20px 50px rgba(0,0,0,.9);touch-action:none;
  transition:transform .05s ease-out,opacity .5s;
  display:flex;justify-content:center;align-items:center;
}
#plate::before{content:'';position:absolute;width:110px;height:110px;border-radius:50%;border:4px solid #1a1a1a;box-shadow:inset 0 5px 15px rgba(0,0,0,.8),0 5px 15px rgba(0,0,0,.6);background:linear-gradient(145deg,#222,#111)}
#plate::after{content:'';position:absolute;width:70px;height:70px;border-radius:50%;border:2px solid #0a0a0a;background:#0f0f0f;box-shadow:inset 0 2px 10px #000}
.shaking{animation:plate-vibrate .07s infinite}
@keyframes plate-vibrate{0%{transform:translate(3px,3px)}50%{transform:translate(-3px,-3px)}100%{transform:translate(3px,-3px)}}
#dice-sum{
  position:absolute;top:72%;left:50%;transform:translate(-50%,-20px) scale(.8);
  background:var(--gold);color:#000;padding:8px 30px;border-radius:20px;
  font-size:26px;font-weight:900;letter-spacing:2px;
  box-shadow:0 0 30px rgba(241,196,15,.9);z-index:2000;pointer-events:none;
  opacity:0;transition:all .3s ease-out;
}
.show-sum{opacity:1 !important;transform:translate(-50%,0) scale(1) !important}
/* ---- LỊCH SỬ ---- */
.history-bar{display:flex;justify-content:center;gap:8px;padding:12px;background:rgba(255,255,255,.08);min-height:20px}
.dot{width:16px;height:16px;border-radius:50%;flex:none}
.dot.tai{background:#000;box-shadow:0 0 8px rgba(0,0,0,.8);border:1px solid #666}
.dot.xiu{background:#fff;box-shadow:0 0 8px #fff}
/* ---- CƯỢC ---- */
.footer-bet{
  padding:18px 15px 26px;background:rgba(0,0,0,.4);text-align:center;position:relative;z-index:50;
  border-top:1px solid rgba(0,210,255,.2);
  border-radius:0 0 32px 32px;
}
.bet-input-box{margin-bottom:14px}
.bet-input{
  background:#000;border:2px solid var(--accent);color:#fff;padding:10px;width:280px;
  text-align:center;font-size:25px;border-radius:12px;font-family:'Roboto Mono',monospace;
  transition:.3s;letter-spacing:1px;
}
.bet-confirmed{border-color:var(--success) !important;color:var(--success) !important;box-shadow:0 0 15px var(--success);animation:pulse-success 1s infinite}
@keyframes pulse-success{0%{opacity:1}50%{opacity:.7}100%{opacity:1}}
.btn-group{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.btn{
  background:var(--accent);border:none;padding:10px 15px;font-weight:700;border-radius:8px;
  cursor:pointer;color:#050a18;text-transform:uppercase;font-size:14px;transition:.2s;
  font-family:'Oswald';letter-spacing:1px;
}
.btn:active{transform:scale(.95)}
.disabled{opacity:.4;pointer-events:none;filter:grayscale(1)}
.btn-allin{
  background:linear-gradient(145deg,#512da8,#311b92) !important;color:#d1c4e9 !important;
  font-size:17px;padding:12px 35px;border-radius:30px;border:2px solid #7e57c2;
  box-shadow:inset 0 2px 5px rgba(255,255,255,.3),0 5px 15px rgba(49,27,146,.7);
  text-shadow:0 1px 2px rgba(0,0,0,.5);transition:.3s;
}
.btn-confirm{
  background:linear-gradient(145deg,#d4af37,#b8860b) !important;color:#fff !important;
  font-size:17px;padding:12px 35px;border-radius:30px;border:2px solid var(--gold);
  box-shadow:inset 0 2px 5px rgba(255,255,255,.4),0 5px 15px rgba(184,134,11,.7);
  text-shadow:0 1px 3px rgba(0,0,0,.6);transition:.3s;
}
.btn-cancel{
  background:linear-gradient(145deg,#c62828,#b71c1c) !important;color:#ffcdd2 !important;
  font-size:17px;padding:12px 35px;border-radius:30px;border:2px solid #e53935;
  box-shadow:inset 0 2px 5px rgba(255,255,255,.3),0 5px 15px rgba(183,28,28,.7);
  text-shadow:0 1px 2px rgba(0,0,0,.5);transition:.3s;
}
.btn-allin:hover,.btn-confirm:hover,.btn-cancel:hover{filter:brightness(1.15);transform:translateY(-2px)}
.btn-allin:active,.btn-confirm:active,.btn-cancel:active{transform:translateY(1px) scale(.95)}
/* ---- TOAST ---- */
#game-toast{
  position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);
  background:rgba(4,10,25,.95);color:var(--accent);padding:24px 48px;
  border-radius:20px;border:3px solid var(--accent);z-index:9000;
  display:none;font-weight:700;font-size:24px;text-transform:uppercase;
  text-align:center;box-shadow:0 0 50px rgba(0,210,255,.6);width:78%;line-height:1.45;
}
@media(max-width:700px){
  .side{width:140px;height:140px}
  .side-title{font-size:88px}
  .bet-input{width:100%}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="ic-coin" viewBox="0 0 24 24">
  <circle cx="12" cy="12" r="9" fill="none" stroke="#f1c40f" stroke-width="2.4"/>
  <circle cx="12" cy="12" r="4.2" fill="none" stroke="#f1c40f" stroke-width="1.8"/>
</symbol>
<symbol id="ic-snd" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/></g></symbol>
<symbol id="ic-mute" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m16 9 5 6m0-6-5 6"/></g></symbol>
<symbol id="ic-back" viewBox="0 0 24 24"><path d="M19 12H5m6-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>

<div class="casino-modal" id="modal">
  <canvas id="fx"></canvas>

  <div class="top-bar">
    <div class="tb-left">
      <a href="index.html" class="tb-btn"><svg><use href="#ic-back"/></svg>TRANG CHỦ</a>
      <button class="tb-btn" id="sound-btn" title="Âm thanh">
        <svg class="on"><use href="#ic-snd"/></svg>
        <svg class="off"><use href="#ic-mute"/></svg>
      </button>
    </div>
    <div class="tb-title">TÀI XỈU · ĐĨA BẠC</div>
    <div class="tb-right">
      <div class="balance-box"><svg><use href="#ic-coin"/></svg><span id="bal">5.000.000</span></div>
    </div>
  </div>

  <div class="status-bar" id="status-text">MỜI ÔNG CHỦ ĐẶT CƯỢC...</div>

  <div class="play-area">
    <div class="side" id="side-tai"><div class="side-title">TÀI</div></div>
    <div class="bowl-center">
      <div class="dice-container">
        <div id="d1" class="dice"><span class="q">?</span></div>
        <div id="d2" class="dice"><span class="q">?</span></div>
        <div id="d3" class="dice"><span class="q">?</span></div>
      </div>
      <div id="plate"></div>
    </div>
    <div class="side" id="side-xiu"><div class="side-title">XỈU</div></div>
    <div id="dice-sum">TỔNG: 0</div>
  </div>

  <div class="history-bar" id="history"></div>

  <div class="footer-bet">
    <div class="bet-input-box">
      <input type="text" class="bet-input" id="bet-val" value="0" readonly>
    </div>
    <div class="btn-group" id="money-btns" style="margin-bottom:15px">
      <button class="btn" data-add="50000">+50K</button>
      <button class="btn" data-add="100000">+100K</button>
      <button class="btn" data-add="500000">+500K</button>
      <button class="btn" data-add="1000000">+1M</button>
      <button class="btn" data-add="5000000">+5M</button>
    </div>
    <div class="btn-group" id="action-btns">
      <button class="btn btn-allin" id="btn-allin">ALL-IN</button>
      <button class="btn btn-confirm" id="btn-confirm">ĐẶT CƯỢC</button>
      <button class="btn btn-cancel" id="btn-cancel">HỦY</button>
    </div>
  </div>

  <div id="game-toast"></div>
</div>

<script>
/* ============ VÍ TIỀN CHUNG (key "userBalance") ============ */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const fmt = n => Math.round(n).toLocaleString('vi-VN');
const wallet = {
  bal: 0, shown: 0, anim: null, el: $('#bal'),
  load(){
    const v = parseInt(String(localStorage.getItem('userBalance')||'').replace(/[.,\s]/g,''));
    this.bal = isNaN(v) ? 5000000 : v; this.render();
  },
  render(){ this.el.textContent = fmt(this.bal); this.shown = this.bal },
  set(v){
    this.bal = Math.max(0, Math.round(v));
    localStorage.setItem('userBalance', this.bal);
    if(this.anim) cancelAnimationFrame(this.anim);
    const from = this.shown, to = this.bal, t0 = performance.now();
    const step = t => { const p = Math.min(1,(t-t0)/650), e = 1-Math.pow(1-p,3);
      this.shown = Math.round(from+(to-from)*e); this.el.textContent = fmt(this.shown);
      if(p<1) this.anim = requestAnimationFrame(step); else this.anim = null };
    this.anim = requestAnimationFrame(step);
  },
  add(v){ this.set(this.bal + v) }
};
wallet.load();
addEventListener('storage', e => { if(e.key === 'userBalance') wallet.load() });

/* ============ ÂM THANH (WebAudio, chung khóa "muted") ============ */
const sound = {
  muted: localStorage.getItem('muted') === '1', ctx: null,
  ac(){ try{
    if(!this.ctx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; this.ctx = new C() }
    if(this.ctx.state === 'suspended'){ this.ctx.resume().catch(()=>{}) }
    return this.ctx;
  }catch(e){ return null } },
  tone(f, dur=.1, type='sine', vol=.06, when=0, slide=0){
    if(this.muted) return; const c = this.ac(); if(!c) return;
    try{
      const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f+slide), t+dur);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.012);
      g.gain.exponentialRampToValueAtTime(.0001, t+dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
    }catch(e){}
  },
  click(){ this.tone(720,.05,'triangle',.05) },
  chip(){ this.tone(520,.06,'triangle',.05); this.tone(780,.05,'triangle',.04,.05) },
  tick(){ this.tone(1050,.05,'triangle',.05) },
  rattle(){ this.tone(800+Math.random()*700,.04,'square',.025) },
  open(){ this.tone(400,.12,'triangle',.06,0,300); this.tone(1250,.08,'triangle',.05,.1) },
  win(){ [523,659,784,1046].forEach((f,i)=>this.tone(f,.14,'sine',.07,i*.09));
    for(let i=0;i<8;i++) this.tone(1600+Math.random()*600,.05,'triangle',.035,.5+Math.random()*.6) },
  lose(){ this.tone(240,.2,'sine',.045,0,-100) }
};
function syncSndBtn(){ $('#sound-btn').classList.toggle('muted', sound.muted) }
syncSndBtn();
 $('#sound-btn').addEventListener('click', () => {
  sound.muted = !sound.muted;
  try{ localStorage.setItem('muted', sound.muted ? '1' : '0') }catch(e){}
  syncSndBtn();
  if(!sound.muted) sound.click();
});
addEventListener('storage', e => {
  if(e.key === 'muted'){ sound.muted = e.newValue === '1'; syncSndBtn() }
});

/* ============ KIM SA THẮNG (thay confetti CDN) ============ */
const fx = (() => {
  const cv = $('#fx'), ctx = cv.getContext('2d'); let parts = [], raf = null;
  function loop(){
    raf = requestAnimationFrame(loop);
    ctx.clearRect(0,0,cv.width,cv.height);
    if(!parts.length){ cancelAnimationFrame(raf); raf = null; return }
    for(const p of parts){
      p.vy += p.g; p.x += p.vx; p.y += p.vy;
      p.rot += p.vr; p.al -= .008;
      ctx.globalAlpha = Math.max(0, p.al); ctx.fillStyle = p.col;
      if(p.shape === 'rect'){ ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
        ctx.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2); ctx.restore() }
      else{ ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill() }
    }
    ctx.globalAlpha = 1;
    parts = parts.filter(p => p.al > 0 && p.y < cv.height + 30);
  }
  return { burst(){
    const r = cv.parentElement.getBoundingClientRect();
    cv.width = r.width; cv.height = r.height;
    for(let i=0;i<120;i++) parts.push({
      x: cv.width/2+(Math.random()-.5)*cv.width*.6, y: cv.height*.45,
      vx:(Math.random()-.5)*4, vy:-3-Math.random()*3.5, g:.12,
      r:1.4+Math.random()*2.6, al:1,
      col:['#f1c40f','#ffd32a','#00d2ff'][Math.floor(Math.random()*3)],
      rot:Math.random()*6, vr:(Math.random()-.5)*.3, shape:Math.random()<.4?'rect':'dot'
    });
    if(!raf) loop();
  }};
})();

/* ============ MODAL CO GIÃN THEO MÀN HÌNH ============ */
const modal = $('#modal');
function fit(){
  const s = Math.min(1, (innerWidth - 24) / 1140, (innerHeight - 24) / 690);
  modal.style.transform = `scale(${s.toFixed(3)})`;
}
addEventListener('resize', fit); fit();

/* ============ TRẠNG THÁI VÁN ============ */
let gameHistory = [];
try{ gameHistory = JSON.parse(localStorage.getItem('casino_history') || '[]') }catch(e){ gameHistory = [] }

let phase = 'bet', countdown = 15;
let betAmt = 0, betSide = null, result = '', isConfirmed = false, hasOpened = false;
let rattleTimer = null, isDragging = false, startX = 0, startY = 0;

const plate = $('#plate'), toast = $('#game-toast'), sumDisplay = $('#dice-sum');
const betInput = $('#bet-val'), statusText = $('#status-text');

/* ============ XÚC XẺ MẶT CHẤM ============ */
const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function setDice(el, v){
  if(!v){ el.innerHTML = '<span class="q">?</span>'; return }
  const on = PIPS[v];
  el.innerHTML = Array.from({length:9}, (_,i) =>
    `<i class="pip"${on.includes(i) ? '' : ' style="opacity:0"'}></i>`).join('');
}
setDice($('#d1'), 0); setDice($('#d2'), 0); setDice($('#d3'), 0);

/* ============ HIỂN THỊ ============ */
function renderHistory(){
  $('#history').innerHTML = gameHistory.map(h => `<div class="dot ${h}"></div>`).join('');
}
function pushHistory(type){
  gameHistory.push(type);
  if(gameHistory.length > 16) gameHistory.shift();
  try{ localStorage.setItem('casino_history', JSON.stringify(gameHistory)) }catch(e){}
  renderHistory();
}
renderHistory();

function showToast(msg, ms=3000){
  toast.innerHTML = msg;
  toast.style.display = 'block';
  setTimeout(() => { toast.style.display = 'none' }, ms);
}
function resetStatusClasses(){ statusText.classList.remove('flash-red','flash-yellow','flash-green') }
function updateBetUI(){ betInput.value = fmt(betAmt) }
function setControlsEnabled(on){
  $('#money-btns').classList.toggle('disabled', !on);
  $('#action-btns').classList.toggle('disabled', !on);
}

/* ============ CƯỢC ============ */
 $$('#money-btns .btn').forEach(b => b.addEventListener('click', () => {
  if(phase !== 'bet' || isConfirmed) return;
  const amount = +b.dataset.add;
  if(wallet.bal >= amount && amount > 0){
    betAmt += amount;
    wallet.add(-amount);
    updateBetUI();
    sound.chip();
  } else {
    showToast('ÔNG CHỦ KHÔNG ĐỦ LÚA!', 2000);
    sound.lose();
  }
}));
 $('#btn-allin').addEventListener('click', () => {
  if(phase !== 'bet' || isConfirmed) return;
  if(wallet.bal > 0){
    betAmt += wallet.bal;
    wallet.add(-wallet.bal);
    updateBetUI();
    sound.chip();
  } else {
    showToast('ÔNG CHỦ KHÔNG ĐỦ LÚA!', 2000);
  }
});
 $('#btn-confirm').addEventListener('click', () => {
  if(phase !== 'bet' || isConfirmed) return;
  if(!betSide) return showToast('ÔNG CHỦ QUÊN CHỌN<br>TÀI HOẶC XỈU RỒI!', 2400);
  if(betAmt <= 0) return showToast('ÔNG CHỦ CHƯA ĐẶT TIỀN CƯỢC!', 2400);
  isConfirmed = true;
  betInput.classList.add('bet-confirmed');
  setControlsEnabled(false);
  sound.click();
  showToast('ĐÃ XÁC NHẬN CƯỢC!<br>CHỜ LẮC XONG RỒI NẶN NHÉ.', 2400);
});
 $('#btn-cancel').addEventListener('click', () => {
  if(isConfirmed || phase !== 'bet') return;
  wallet.add(betAmt);
  betAmt = 0; betSide = null;
  updateBetUI();
  $$('.side').forEach(s => s.classList.remove('selected'));
  sound.chip();
});
 $$('.side').forEach(side => side.addEventListener('click', () => {
  if(phase !== 'bet' || isConfirmed) return;
  const s = side.id === 'side-tai' ? 'Tai' : 'Xiu';
  betSide = (betSide === s) ? null : s;
  $('#side-tai').classList.toggle('selected', betSide === 'Tai');
  $('#side-xiu').classList.toggle('selected', betSide === 'Xiu');
  sound.click();
}));

/* ============ KÉO NẮN ĐĨA (chuột + cảm ứng) ============ */
function dragStart(x, y){
  if(phase !== 'press') return;
  if(!isConfirmed){ showToast('VUI LÒNG NHẤN ĐẶT CƯỢC<br>TRƯỚC KHI NẶN!', 2400); return }
  isDragging = true; startX = x; startY = y;
}
function dragMove(x, y){
  if(!isDragging) return;
  const dx = (x - startX) * 2.5, dy = (y - startY) * 2.5;
  plate.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx/5}deg)`;
  if(Math.abs(dx) > 150 || Math.abs(dy) > 150) openPlate();
}
function dragEnd(){
  isDragging = false;
  if(!hasOpened) plate.style.transform = 'translate(0,0)';
}
plate.addEventListener('mousedown', e => dragStart(e.clientX, e.clientY));
window.addEventListener('mousemove', e => dragMove(e.clientX, e.clientY));
window.addEventListener('mouseup', dragEnd);
plate.addEventListener('touchstart', e => { e.preventDefault(); dragStart(e.touches[0].clientX, e.touches[0].clientY) }, {passive:false});
plate.addEventListener('touchmove', e => { e.preventDefault(); dragMove(e.touches[0].clientX, e.touches[0].clientY) }, {passive:false});
plate.addEventListener('touchend', dragEnd);

/* ============ MỞ ĐĨA & XÉT KẾT QUẢ ============ */
let diceVals = [0,0,0];
function openPlate(){
  if(hasOpened) return;
  hasOpened = true;
  plate.style.display = 'none';
  resetStatusClasses();
  sound.open();

  const winId = (result === 'Tai') ? 'side-tai' : 'side-xiu';
  document.getElementById(winId).classList.add('win-active');

  const total = diceVals[0] + diceVals[1] + diceVals[2];
  sumDisplay.innerText = `TỔNG: ${total} ĐIỂM`;
  sumDisplay.classList.add('show-sum');
  setTimeout(() => sumDisplay.classList.remove('show-sum'), 4000);

  pushHistory(result.toLowerCase());

  if(isConfirmed && betSide === result){
    wallet.add(betAmt * 2);
    sound.win();
    fx.burst();
    showToast(`CHÚC MỪNG ÔNG CHỦ!<br>THẮNG CƯỢC +${fmt(betAmt*2)}Đ`, 3200);
  } else if(isConfirmed && betSide !== result){
    setTimeout(() => {
      showToast('CÒN THỞ LÀ CÒN GỠ,<br>ÔNG CHỦ ƠI!', 2600);
      sound.lose();
    }, 900);
  }
}

/* ============ STATE MACHINE VÁN ============ */
function lockBets(){
  if(!isConfirmed && betAmt > 0){
    wallet.add(betAmt);
    betAmt = 0; betSide = null;
    updateBetUI();
    $$('.side').forEach(s => s.classList.remove('selected'));
    showToast('HẾT GIỜ CƯỢC!<br>TIỀN ĐÃ ĐƯỢC HOÀN LẠI.', 2400);
  }
  setControlsEnabled(false);
}
function startShake(){
  plate.classList.add('shaking');
  rattleTimer = setInterval(() => sound.rattle(), 130);
}
function rollDice(){
  diceVals = [0,0,0].map(() => Math.floor(Math.random()*6)+1);
  result = (diceVals[0]+diceVals[1]+diceVals[2] >= 11) ? 'Tai' : 'Xiu';
  setDice($('#d1'), diceVals[0]);
  setDice($('#d2'), diceVals[1]);
  setDice($('#d3'), diceVals[2]);
}
function stopShake(){
  plate.classList.remove('shaking');
  if(rattleTimer){ clearInterval(rattleTimer); rattleTimer = null }
}
function resetRound(){
  plate.style.display = 'flex';
  plate.style.transform = 'translate(0,0)';
  $$('.side').forEach(s => s.classList.remove('win-active','selected'));
  setDice($('#d1'), 0); setDice($('#d2'), 0); setDice($('#d3'), 0);
  sumDisplay.classList.remove('show-sum');
  resetStatusClasses();
  hasOpened = false;
  betAmt = 0; betSide = null; isConfirmed = false;
  betInput.classList.remove('bet-confirmed');
  setControlsEnabled(true);
  updateBetUI();
}

setInterval(() => {
  if(phase === 'bet'){
    statusText.innerText = `THỜI GIAN CƯỢC: ${Math.max(0, countdown)}s`;
    resetStatusClasses(); statusText.classList.add('flash-red');
    if(countdown <= 3 && countdown > 0) sound.tick();
    countdown--;
    if(countdown < 0){
      lockBets();
      phase = 'shake'; countdown = 3;
      statusText.innerText = 'ĐANG LẮC...';
      resetStatusClasses(); statusText.classList.add('flash-yellow');
      startShake();
    }
  }
  else if(phase === 'shake'){
    countdown--;
    if(countdown < 0){
      stopShake();
      rollDice();
      phase = 'press'; countdown = 8;
    }
  }
  else if(phase === 'press'){
    statusText.innerText = `MỜI ÔNG CHỦ NẶN: ${Math.max(0, countdown)}s`;
    resetStatusClasses(); statusText.classList.add('flash-green');
    countdown--;
    if(countdown < 0){
      if(!hasOpened) openPlate();
      phase = 'result'; countdown = 3;
      statusText.innerText = 'VÁN KẾT THÚC...';
    }
  }
  else if(phase === 'result'){
    countdown--;
    if(countdown < 0){
      resetRound();
      phase = 'bet'; countdown = 15;
    }
  }
}, 1000);

updateBetUI();
</script>
</body>
</html>
