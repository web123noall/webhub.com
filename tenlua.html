<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tên Lửa — Trung Tâm Giải Trí</title>
<style>
:root{
  --primary:#10b981;
  --danger:#ef4444;
  --warning:#f59e0b;
  --bg-dark:#0b0f19;
  --panel-bg:rgba(26,30,46,.7);
}
*{box-sizing:border-box}
body{
  font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  background:var(--bg-dark);color:#fff;text-align:center;
  padding:16px 10px 50px;margin:0;overflow-x:hidden;
  display:flex;flex-direction:column;align-items:center;
}
.container{width:100%;max-width:820px}
/* ---- HUB ---- */
.header{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  padding:12px 20px;background:var(--panel-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:16px;margin-bottom:16px;border:1px solid rgba(255,255,255,.1);
  box-shadow:0 8px 32px rgba(0,0,0,.3);
}
.h-left{display:flex;align-items:center;gap:12px}
.h-home{
  display:flex;align-items:center;gap:8px;color:var(--primary);text-decoration:none;
  font-weight:700;font-size:15px;transition:.2s;letter-spacing:.5px;
}
.h-home svg{width:16px;height:16px}
.h-home:hover{text-shadow:0 0 10px var(--primary)}
.h-title{font-size:13px;letter-spacing:3px;color:rgba(255,255,255,.5);font-weight:700}
.h-right{display:flex;align-items:center;gap:10px}
.icon-btn{
  width:40px;height:40px;border-radius:12px;border:1px solid rgba(16,185,129,.45);
  background:rgba(16,185,129,.08);color:var(--primary);display:grid;place-items:center;
  cursor:pointer;transition:.2s;
}
.icon-btn:hover{background:var(--primary);color:#fff;box-shadow:0 0 12px rgba(16,185,129,.4)}
.icon-btn svg{width:17px;height:17px}
#sound-btn .off{display:none}
#sound-btn.muted .on{display:none}
#sound-btn.muted .off{display:block}
#sound-btn.muted{color:rgba(255,255,255,.35);border-color:rgba(255,255,255,.15)}
.balance-box{
  display:flex;align-items:center;gap:9px;padding:9px 16px;border-radius:12px;
  border:1px solid rgba(252,211,77,.45);background:rgba(252,211,77,.07);
  font-weight:700;font-size:18px;color:#fcd34d;text-shadow:0 0 10px rgba(252,211,77,.35);
}
.balance-box svg{width:19px;height:19px;flex:none}
/* ---- LỊCH SỬ NỔ ---- */
.history-area{display:flex;justify-content:flex-start;gap:10px;margin-bottom:16px;overflow-x:auto;padding:8px 4px;scrollbar-width:none}
.history-area::-webkit-scrollbar{display:none}
.history-item{
  padding:7px 15px;border-radius:20px;font-weight:800;font-size:14px;min-width:55px;
  text-align:center;box-shadow:0 4px 10px rgba(0,0,0,.3);letter-spacing:.5px;flex:none;
  animation:histIn .3s;
}
@keyframes histIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.history-high{background:rgba(16,185,129,.2);color:var(--primary);border:1px solid var(--primary)}
.history-low{background:rgba(239,68,68,.2);color:var(--danger);border:1px solid var(--danger)}
/* ---- KHU GAME PARALLAX ---- */
.game-area{
  background:linear-gradient(180deg,#090f1e 0%,#171738 100%);
  height:480px;border-radius:20px;border:1px solid rgba(255,255,255,.15);
  margin-bottom:20px;position:relative;overflow:hidden;
  box-shadow:inset 0 0 80px rgba(0,0,0,.8),0 10px 30px rgba(0,0,0,.5);
}
.game-area.boom::after{
  content:'';position:absolute;inset:0;background:rgba(239,68,68,.35);z-index:40;
  animation:boomFlash .55s forwards;pointer-events:none;
}
@keyframes boomFlash{from{opacity:1}to{opacity:0}}
.sky-layer{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,#5bb4eb 0%,#a6d6f5 100%);transition:opacity 2.5s ease-in-out;z-index:1}
.clouds-layer{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 200 200"><circle cx="50" cy="50" r="30" fill="white" opacity="0.3"/><circle cx="150" cy="120" r="40" fill="white" opacity="0.2"/><circle cx="180" cy="30" r="25" fill="white" opacity="0.25"/><circle cx="20" cy="160" r="35" fill="white" opacity="0.15"/></svg>') repeat;
  transition:opacity 2s ease;z-index:2;
}
.stars-bg-1,.stars-bg-2{position:absolute;top:0;left:0;right:0;bottom:0;opacity:0;transition:opacity 2.5s ease-in-out;z-index:0}
.stars-bg-1{
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><circle cx="20" cy="30" r="0.8" fill="white" opacity="0.6"/><circle cx="80" cy="120" r="1" fill="white" opacity="0.4"/><circle cx="150" cy="40" r="0.5" fill="white" opacity="0.8"/><circle cx="190" cy="180" r="1.2" fill="white" opacity="0.5"/><circle cx="50" cy="160" r="0.6" fill="white" opacity="0.7"/><circle cx="110" cy="80" r="1" fill="white" opacity="0.3"/></svg>');
  background-size:150px 150px;
}
.stars-bg-2{
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><circle cx="45" cy="80" r="1.5" fill="white" opacity="0.9"/><circle cx="160" cy="150" r="2" fill="white" opacity="0.8"/><circle cx="120" cy="20" r="1.2" fill="#fcd34d" opacity="0.7"/><circle cx="30" cy="190" r="1.8" fill="#a6d6f5" opacity="0.8"/></svg>');
  background-size:250px 250px;
}
.scrolling-slow{animation:scrollBg 6s linear infinite}
.scrolling-fast{animation:scrollBg 3s linear infinite}
@keyframes scrollBg{from{background-position:0 0}to{background-position:0 500px}}
.center-flight-group{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;gap:50px;z-index:10;width:100%;
}
#rocket-wrapper{position:relative;transition:all .3s}
#rocket-emoji{font-size:90px;display:inline-block;transform:rotate(-45deg);filter:drop-shadow(0 10px 10px rgba(0,0,0,.5))}
.floating{animation:floatEffect 1.5s ease-in-out infinite alternate}
@keyframes floatEffect{0%{transform:translateY(0)}100%{transform:translateY(-15px)}}
.crashing{animation:crashEffect .6s forwards cubic-bezier(.5,0,1,1) !important;filter:grayscale(100%) brightness(40%)}
@keyframes crashEffect{
  0%{transform:scale(1) rotate(0deg);opacity:1}
  50%{transform:scale(1.2) rotate(90deg);opacity:.8;filter:brightness(200%) hue-rotate(-50deg)}
  100%{transform:scale(.5) translateY(100px) rotate(180deg);opacity:0}
}
.rocket-fire{
  display:none;position:absolute;bottom:-25px;left:50%;transform:translateX(-50%);
  width:26px;height:50px;
  background:radial-gradient(ellipse at top,#fff 0%,#ffeb3b 30%,#ff9800 60%,transparent 100%);
  border-radius:50% 50% 20% 20%;animation:burn .05s infinite alternate;z-index:-1;
  filter:blur(1px) drop-shadow(0 0 10px #ff9800);
}
@keyframes burn{
  0%{transform:translateX(-50%) scaleY(1) scaleX(.9);opacity:.8}
  100%{transform:translateX(-50%) scaleY(1.3) scaleX(1.1);opacity:1}
}
.text-box{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:250px}
#multiplier{
  font-size:110px;color:var(--primary);font-weight:900;
  font-family:'Courier New',Courier,monospace;line-height:1;
  text-shadow:0 0 20px rgba(16,185,129,.6),0 5px 15px rgba(0,0,0,.5);transition:color .3s;
}
#status{
  font-size:18px;font-weight:600;color:#e2e8f0;text-shadow:0 2px 4px rgba(0,0,0,.8);
  margin-top:10px;letter-spacing:.5px;background:rgba(0,0,0,.3);padding:5px 15px;border-radius:20px;
}
#parachute-container{
  position:absolute;font-size:70px;display:none;z-index:15;
  filter:drop-shadow(0 10px 10px rgba(0,0,0,.5));transform:translate(-50%,-50%);
}
.float-win{
  position:absolute;font-weight:900;font-size:30px;color:#fcd34d;z-index:20;pointer-events:none;
  text-shadow:0 2px 8px rgba(0,0,0,.8);animation:floatWin 1.4s forwards;
}
@keyframes floatWin{0%{opacity:1;transform:translateY(0) scale(.7)}25%{transform:translateY(-24px) scale(1.15)}100%{opacity:0;transform:translateY(-90px) scale(1)}}
/* ---- ĐIỀU KHIỂN ---- */
.controls{
  background:var(--panel-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:28px;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.5);
  border:1px solid rgba(255,255,255,.05);
}
.notif-box{
  background:rgba(0,0,0,.4);color:#fcd34d;padding:14px;border-radius:12px;
  font-weight:600;font-size:16px;margin-bottom:22px;border-left:5px solid var(--primary);
  text-align:center;min-height:52px;transition:border-color .3s,color .3s;
}
.bet-presets{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:22px}
.bet-presets button{
  background:rgba(16,185,129,.1);color:var(--primary);border:1px solid rgba(16,185,129,.4);
  padding:10px 16px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;transition:all .2s;
}
.bet-presets button:hover{background:var(--primary);color:#fff;box-shadow:0 0 15px rgba(16,185,129,.4);transform:translateY(-2px)}
.input-row{display:flex;justify-content:center;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.input-group{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.input-group label{font-size:13px;color:#94a3b8;font-weight:600;padding-left:5px}
input{
  padding:15px;font-size:18px;border-radius:12px;border:1px solid rgba(255,255,255,.2);
  background:rgba(0,0,0,.3);color:#fff;width:220px;text-align:center;font-weight:700;transition:.3s;
}
input::placeholder{color:#64748b;font-weight:400}
input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 15px rgba(16,185,129,.3);background:rgba(0,0,0,.5)}
input.locked{opacity:.45;pointer-events:none}
.action-area{display:flex;justify-content:center;gap:18px;align-items:center;flex-wrap:wrap}
.btn-main{
  padding:18px 38px;font-size:19px;cursor:pointer;border:none;border-radius:14px;font-weight:900;
  text-transform:uppercase;transition:.2s;box-shadow:0 6px 0 rgba(0,0,0,.3);letter-spacing:1px;
}
.btn-main:active{transform:translateY(6px);box-shadow:none}
#btn-place-bet{background:linear-gradient(135deg,#10b981 0%,#059669 100%);color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3)}
#btn-place-bet:hover{box-shadow:0 6px 0 #047857,0 10px 20px rgba(16,185,129,.4)}
#btn-cancel-bet{background:linear-gradient(135deg,#ef4444 0%,#dc2626 100%);color:#fff;display:none}
#btn-cancel-bet:hover{box-shadow:0 6px 0 #b91c1c,0 10px 20px rgba(239,68,68,.4)}
#btn-jump{
  background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);color:#fff;display:none;
  text-shadow:0 2px 4px rgba(0,0,0,.3);animation:jumpPulse 1s infinite;
}
#btn-jump:hover{box-shadow:0 6px 0 #b45309,0 10px 20px rgba(245,158,11,.4)}
@keyframes jumpPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@media(max-width:600px){
  .center-flight-group{flex-direction:column;gap:10px}
  #rocket-emoji{font-size:70px}
  #multiplier{font-size:80px}
  input{width:100%}
  .input-group{width:100%}
  .btn-main{width:100%}
}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="ic-coin" viewBox="0 0 24 24">
  <circle cx="12" cy="12" r="9" fill="none" stroke="#fcd34d" stroke-width="2.4"/>
  <circle cx="12" cy="12" r="4.2" fill="none" stroke="#fcd34d" stroke-width="1.8"/>
</symbol>
<symbol id="ic-snd" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12"/></g></symbol>
<symbol id="ic-mute" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m16 9 5 6m0-6-5 6"/></g></symbol>
<symbol id="ic-back" viewBox="0 0 24 24"><path d="M19 12H5m6-7-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>

<div class="container">
  <div class="header">
    <div class="h-left">
      <a href="index.html" class="h-home"><svg><use href="#ic-back"/></svg>TRANG CHỦ</a>
      <span class="h-title">TÊN LỬA · CRASH</span>
    </div>
    <div class="h-right">
      <button class="icon-btn" id="sound-btn" title="Âm thanh">
        <svg class="on"><use href="#ic-snd"/></svg>
        <svg class="off"><use href="#ic-mute"/></svg>
      </button>
      <div class="balance-box"><svg><use href="#ic-coin"/></svg><span id="global-balance">5.000.000</span></div>
    </div>
  </div>

  <div class="history-area" id="history-box"></div>

  <div class="game-area" id="game-area">
    <div class="sky-layer" id="sky-layer"></div>
    <div class="clouds-layer" id="clouds-layer"></div>
    <div class="stars-bg-1" id="stars-bg-1"></div>
    <div class="stars-bg-2" id="stars-bg-2"></div>

    <div class="center-flight-group">
      <div id="rocket-wrapper">
        <div id="rocket-emoji">🚀</div>
        <div id="rocket-fire" class="rocket-fire"></div>
      </div>
      <div class="text-box">
        <div id="multiplier">1.00x</div>
        <div id="status">Đang chuẩn bị...</div>
      </div>
    </div>

    <div id="parachute-container">🪂</div>
  </div>

  <div class="controls">
    <div class="notif-box" id="notif-box">Hệ thống đang khởi động...</div>

    <div class="bet-presets" id="bet-presets">
      <button data-act="add" data-val="1000">+ 1K</button>
      <button data-act="add" data-val="10000">+ 10K</button>
      <button data-act="add" data-val="50000">+ 50K</button>
      <button data-act="add" data-val="100000">+ 100K</button>
      <button data-act="add" data-val="500000">+ 500K</button>
      <button data-act="mul">x2 Cược</button>
      <button data-act="half">1/2 Cược</button>
      <button data-act="clear">Xóa</button>
      <button data-act="allin">All In</button>
    </div>

    <div class="input-row">
      <div class="input-group">
        <label>Số Tiền Cược</label>
        <input type="number" id="bet-amount" placeholder="Nhập số tiền..." min="1000">
      </div>
      <div class="input-group">
        <label>Tự Động Chốt Lời (Tùy chọn)</label>
        <input type="number" id="auto-jump" placeholder="VD: 2.0" step="0.1" min="1.01">
      </div>
    </div>

    <div class="action-area">
      <button id="btn-place-bet" class="btn-main">Đặt Cược Ngay</button>
      <button id="btn-cancel-bet" class="btn-main">Hủy Cược</button>
      <button id="btn-jump" class="btn-main">Chốt Lời Ngay</button>
    </div>
  </div>
</div>

<script>
/* ============ VÍ TIỀN CHUNG (key "userBalance") ============ */
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('vi-VN');
const wallet = {
  bal: 0, shown: 0, anim: null, el: $('#global-balance'),
  load(){
    const v = parseInt(String(localStorage.getItem('userBalance')||'').replace(/[.,\s]/g,''));
    this.bal = isNaN(v) ? 5000000 : v; this.render();
  },
  render(){ this.el.textContent = fmt(this.bal); this.shown = this.bal },
  set(v){
    this.bal = Math.max(0, Math.round(v));
    localStorage.setItem('userBalance', this.bal);
    if(this.anim) cancelAnimationFrame(this.anim);
    const from = this.shown, to = this.bal, t0 = performance.now();
    const step = t => { const p = Math.min(1,(t-t0)/650), e = 1-Math.pow(1-p,3);
      this.shown = Math.round(from+(to-from)*e); this.el.textContent = fmt(this.shown);
      if(p<1) this.anim = requestAnimationFrame(step); else this.anim = null };
    this.anim = requestAnimationFrame(step);
  },
  add(v){ this.set(this.bal + v) }
};
wallet.load();
addEventListener('storage', e => { if(e.key === 'userBalance') wallet.load() });

/* ============ ÂM THANH (WebAudio, chung khóa "muted") ============ */
const sound = {
  muted: localStorage.getItem('muted') === '1', ctx: null,
  ac(){ try{
    if(!this.ctx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; this.ctx = new C() }
    if(this.ctx.state === 'suspended'){ this.ctx.resume().catch(()=>{}) }
    return this.ctx;
  }catch(e){ return null } },
  tone(f, dur=.1, type='sine', vol=.06, when=0, slide=0){
    if(this.muted) return; const c = this.ac(); if(!c) return;
    try{
      const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f+slide), t+dur);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.012);
      g.gain.exponentialRampToValueAtTime(.0001, t+dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
    }catch(e){}
  },
  click(){ this.tone(720,.05,'triangle',.05) },
  chip(){ this.tone(520,.06,'triangle',.05); this.tone(780,.05,'triangle',.04,.05) },
  tick(){ this.tone(1050,.05,'triangle',.05) },
  engine(mult){ this.tone(70 + Math.min(220, mult*14), .14, 'sawtooth', .014) },
  cash(){ [880,1175,1568].forEach((f,i)=>this.tone(f,.1,'triangle',.05,i*.07)) },
  boom(){ this.tone(70,.6,'sawtooth',.1,0,-45); this.tone(120,.4,'square',.05,.05,-80) },
  error(){ this.tone(220,.15,'square',.045,0,-80) }
};
function syncSndBtn(){ $('#sound-btn').classList.toggle('muted', sound.muted) }
syncSndBtn();
 $('#sound-btn').addEventListener('click', () => {
  sound.muted = !sound.muted;
  try{ localStorage.setItem('muted', sound.muted ? '1' : '0') }catch(e){}
  syncSndBtn();
  if(!sound.muted) sound.click();
});
addEventListener('storage', e => {
  if(e.key === 'muted'){ sound.muted = e.newValue === '1'; syncSndBtn() }
});

/* ============ TRẠNG THÁI ============ */
let isRunning = false, isPreparing = false, hasPlacedBet = false;
let isPlaying = false, hasCashedOut = false;
let currentMult = 1.0, crashPoint = 0, betAmount = 0;
let preGameTimer = null, gameRaf = null, launchTime = 0, engineTimer = null;
const WAIT_TIME = 10, GROWTH = 0.12;   /* hệ số = e^(0.12 * giây bay) */
let historyArr = [];
try{ historyArr = JSON.parse(localStorage.getItem('rocket_history') || '[]') }catch(e){ historyArr = [] }

const betInput = $('#bet-amount'), autoInput = $('#auto-jump');

/* ============ THÔNG BÁO ============ */
function notify(msg, type='info'){
  const box = $('#notif-box');
  box.innerText = msg;
  if(type === 'error'){ box.style.borderColor = 'var(--danger)'; box.style.color = 'var(--danger)' }
  else if(type === 'success'){ box.style.borderColor = 'var(--primary)'; box.style.color = 'var(--primary)' }
  else{ box.style.borderColor = '#3b82f6'; box.style.color = '#fcd34d' }
}

/* ============ LỊCH SỬ NỔ ============ */
function renderHistory(){
  const box = $('#history-box');
  box.innerHTML = '';
  historyArr.forEach(m => {
    const el = document.createElement('div');
    const num = parseFloat(m);
    el.className = 'history-item ' + (num >= 2.0 ? 'history-high' : 'history-low');
    el.innerText = m;
    box.appendChild(el);
  });
}
function pushHistory(val){
  historyArr.unshift(val);
  if(historyArr.length > 12) historyArr.pop();
  try{ localStorage.setItem('rocket_history', JSON.stringify(historyArr)) }catch(e){}
  renderHistory();
}
renderHistory();

/* ============ PRESET CƯỢC ============ */
 $('#bet-presets').addEventListener('click', e => {
  const btn = e.target.closest('button'); if(!btn) return;
  if(hasPlacedBet) return;
  const act = btn.dataset.act;
  if(act === 'add'){
    betInput.value = (parseInt(betInput.value) || 0) + (+btn.dataset.val);
    sound.chip();
  }
  else if(act === 'mul'){ betInput.value = (parseInt(betInput.value) || 0) * 2; sound.chip() }
  else if(act === 'half'){ betInput.value = Math.max(1000, Math.floor((parseInt(betInput.value) || 0) / 2)); sound.chip() }
  else if(act === 'clear'){ betInput.value = ''; sound.click() }
  else if(act === 'allin'){ betInput.value = wallet.bal; sound.chip() }
});

/* ============ ĐẶT / HỦY CƯỢC (tiền cược khóa vào biến) ============ */
 $('#btn-place-bet').addEventListener('click', () => {
  if(hasPlacedBet){ notify('Bạn đã đặt cược rồi!', 'error'); sound.error(); return }
  const bet = parseInt(betInput.value);
  if(isNaN(bet) || bet <= 0){ notify('Nhập số tiền hợp lệ!', 'error'); sound.error(); return }
  if(bet > wallet.bal){ notify('Số dư không đủ — về Trang Chủ bốc Bát Họ!', 'error'); sound.error(); return }

  betAmount = bet;
  wallet.add(-bet);
  hasPlacedBet = true;
  betInput.classList.add('locked');
  notify('Đã cược ' + fmt(bet) + 'đ. Chờ tên lửa cất cánh!', 'success');
  $('#btn-place-bet').style.display = 'none';
  $('#btn-cancel-bet').style.display = 'inline-block';
});

 $('#btn-cancel-bet').addEventListener('click', () => {
  if(!hasPlacedBet) return;
  wallet.add(betAmount);            /* hoàn đúng số đã cược */
  hasPlacedBet = false;
  unlockBet();
  notify('Đã hủy cược, hoàn lại ' + fmt(betAmount) + 'đ.', 'info');
  sound.chip();
});
function unlockBet(){
  betAmount = 0;
  betInput.classList.remove('locked');
  $('#btn-place-bet').style.display = 'inline-block';
  $('#btn-cancel-bet').style.display = 'none';
}

/* ============ ĐIỂM NỔ (crypto random) ============ */
function getCrashPoint(){
  const arr = new Uint32Array(1);
  window.crypto.getRandomValues(arr);
  const r = arr[0] / 4294967296;
  if(r <= 0.03) return 1.00;
  let crash = 0.97 / r;
  if(crash < 1.01) crash = 1.01;
  if(crash > 500) crash = 500 + Math.random() * 100;
  return Math.round(crash * 100) / 100;
}

/* ============ CHU KỲ CHỜ 10S ============ */
function startWaitCycle(){
  if(isRunning) return;
  isPreparing = true;
  let waitTime = WAIT_TIME;
  $('#status').innerText = 'Đang chuẩn bị ván mới... (' + waitTime + 's)';
  notify('Sẵn sàng cho ván tiếp theo — Đặt cược ngay!', 'info');

  if(preGameTimer) clearInterval(preGameTimer);
  preGameTimer = setInterval(() => {
    waitTime--;
    $('#status').innerText = 'Đang chuẩn bị ván mới... (' + waitTime + 's)';
    if(waitTime <= 3 && waitTime > 0) sound.tick();
    if(waitTime <= 0){
      clearInterval(preGameTimer); preGameTimer = null;
      isPreparing = false;
      launchRocket();
    }
  }, 1000);
}

/* ============ BAY (rAF + thời gian thực) ============ */
function launchRocket(){
  isRunning = true;
  isPlaying = hasPlacedBet;
  hasCashedOut = false;
  currentMult = 1.0;
  crashPoint = getCrashPoint();
  launchTime = performance.now();

  $('#btn-place-bet').style.display = 'none';
  $('#btn-cancel-bet').style.display = 'none';

  if(isPlaying){
    $('#btn-jump').style.display = 'inline-block';
    notify('Đang bay — canh chuẩn bấm CHỐT LỜI nhé!', 'success');
  } else {
    notify('Ván này bạn đứng xem ngoài lề.', 'info');
  }

  $('#rocket-wrapper').classList.add('floating');
  $('#rocket-fire').style.display = 'block';
  $('#clouds-layer').classList.add('scrolling-fast');
  $('#stars-bg-1').classList.add('scrolling-slow');
  $('#stars-bg-2').classList.add('scrolling-fast');
  $('#status').innerText = isPlaying ? 'Đang bay... Canh chốt lời!' : 'Đang bay... (Khán giả)';

  const multEl = $('#multiplier');

  /* tiếng động cơ tăng pitch theo hệ số */
  engineTimer = setInterval(() => sound.engine(currentMult), 260);

  const autoVal = parseFloat(autoInput.value) || 0;

  function frame(now){
    const t = (now - launchTime) / 1000;
    currentMult = Math.exp(GROWTH * t);

    /* auto chốt lời */
    if(isPlaying && !hasCashedOut && autoVal > 1.0 && currentMult >= autoVal){
      jumpOut();
    }

    if(currentMult >= crashPoint){
      currentMult = crashPoint;
      multEl.innerText = currentMult.toFixed(2) + 'x';
      handleCrash();
      return;
    }

    multEl.innerText = currentMult.toFixed(2) + 'x';

    /* vượt tầng khí quyển */
    if(currentMult >= 2.5){
      $('#sky-layer').style.opacity = '0';
      $('#clouds-layer').style.opacity = '0';
      $('#stars-bg-1').style.opacity = '1';
      $('#stars-bg-2').style.opacity = '1';
      multEl.style.color = 'var(--warning)';
      multEl.style.textShadow = '0 0 30px rgba(245,158,11,.6),0 5px 15px rgba(0,0,0,.5)';
    }

    gameRaf = requestAnimationFrame(frame);
  }
  gameRaf = requestAnimationFrame(frame);
}

/* ============ NỔ ============ */
function handleCrash(){
  isRunning = false;
  if(gameRaf) cancelAnimationFrame(gameRaf);
  if(engineTimer){ clearInterval(engineTimer); engineTimer = null }

  const multEl = $('#multiplier');
  multEl.style.color = 'var(--danger)';
  multEl.style.textShadow = '0 0 30px rgba(239,68,68,.6),0 5px 15px rgba(0,0,0,.5)';
  $('#status').innerText = 'BÙM! Tên lửa đã nổ.';

  pushHistory(crashPoint.toFixed(2) + 'x');
  sound.boom();
  const ga = $('#game-area');
  ga.classList.remove('boom'); void ga.offsetWidth; ga.classList.add('boom');

  if(isPlaying && !hasCashedOut){
    notify('NỔ RỒI! Bạn mất trắng ' + fmt(betAmount) + 'đ vì không chịu nhảy sớm.', 'error');
  } else if(isPlaying && hasCashedOut){
    notify('Nổ ở ' + crashPoint.toFixed(2) + 'x — may mà bạn nhảy rồi!', 'info');
  } else {
    notify('Tên lửa nổ ở mức ' + crashPoint.toFixed(2) + 'x.', 'info');
  }

  const rocket = $('#rocket-wrapper');
  rocket.classList.remove('floating');
  rocket.classList.add('crashing');
  $('#rocket-fire').style.display = 'none';
  $('#clouds-layer').classList.remove('scrolling-fast');
  $('#stars-bg-1').classList.remove('scrolling-slow');
  $('#stars-bg-2').classList.remove('scrolling-fast');

  setTimeout(() => {
    resetGameRound();
    startWaitCycle();
  }, 4000);
}

/* ============ CHỐT LỜI ============ */
function jumpOut(){
  if(!isRunning || !isPlaying || hasCashedOut) return;
  hasCashedOut = true;

  const win = Math.floor(betAmount * currentMult);
  wallet.add(win);
  sound.cash();

  notify('Chốt lời thành công: +' + fmt(win) + 'đ (Mức ' + currentMult.toFixed(2) + 'x)', 'success');

  /* chữ tiền bay lên giữa màn bay */
  const ga = $('#game-area');
  const fw = document.createElement('div');
  fw.className = 'float-win';
  fw.innerText = '+' + fmt(win);
  fw.style.left = '50%'; fw.style.top = '38%';
  fw.style.transform = 'translateX(-50%)';
  ga.appendChild(fw);
  setTimeout(() => fw.remove(), 1400);

  /* dù rơi từ vị trí tên lửa */
  const para = $('#parachute-container');
  const rocket = $('#rocket-wrapper');
  const rocketRect = rocket.getBoundingClientRect();
  const gameRect = ga.getBoundingClientRect();
  const startTop = rocketRect.top - gameRect.top + rocketRect.height / 2;
  const startLeft = rocketRect.left - gameRect.left + rocketRect.width / 2;

  para.style.transition = 'none';
  para.style.left = startLeft + 'px';
  para.style.top = startTop + 'px';
  para.style.display = 'block';
  para.style.opacity = '1';

  setTimeout(() => {
    para.style.transition = 'top 2s ease-in, opacity .5s ease 1.5s';
    para.style.top = (ga.offsetHeight + 100) + 'px';
    setTimeout(() => {
      para.style.opacity = '0';
      setTimeout(() => { para.style.display = 'none' }, 500);
    }, 1500);
  }, 50);

  $('#btn-jump').style.display = 'none';
  $('#status').innerText = 'Đã chốt lời! Đứng xem nổ...';
}
 $('#btn-jump').addEventListener('click', jumpOut);

/* ============ RESET VÁN ============ */
function resetGameRound(){
  hasPlacedBet = false;
  unlockBet();
  betInput.value = '';

  const multEl = $('#multiplier');
  multEl.style.color = 'var(--primary)';
  multEl.style.textShadow = '0 0 20px rgba(16,185,129,.6),0 5px 15px rgba(0,0,0,.5)';
  multEl.innerText = '1.00x';
  $('#status').innerText = 'Nhập tiền và đặt cược';
  $('#btn-jump').style.display = 'none';

  $('#rocket-wrapper').classList.remove('crashing');
  $('#sky-layer').style.opacity = '1';
  $('#clouds-layer').style.opacity = '1';
  $('#stars-bg-1').style.opacity = '0';
  $('#stars-bg-2').style.opacity = '0';
}

/* ============ KHỞI TẠO ============ */
startWaitCycle();
</script>
