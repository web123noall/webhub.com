<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nông Trại Đồng Quê — Trung Tâm Giải Trí</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-grass-1:#7cb342; --bg-grass-2:#558b2f;
  --wood-light:#8D6E63; --wood-main:#5D4037; --wood-dark:#3E2723;
  --soil-empty:#a1887f; --soil-fertilized:#6d4c41;
  --soil-wet:#3e2723; --soil-mature:#fbc02d;
  --gold-text:#FFC107;
  --text-light:#FFF8E1;
}
body{
  font-family:'Quicksand',sans-serif;
  background:radial-gradient(circle at center,var(--bg-grass-1),var(--bg-grass-2));
  color:var(--text-light);margin:0;padding:16px 10px 40px;
  display:flex;flex-direction:column;align-items:center;
  user-select:none;overflow-x:hidden;min-height:100vh;
}
/* ============ HUB GỖ ĐỒNG QUÊ ============ */
.navbar{
  width:95%;max-width:1300px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:linear-gradient(180deg,var(--wood-light) 0%,var(--wood-main) 100%);
  border:4px solid var(--wood-dark);border-radius:16px;padding:10px 18px;margin-bottom:18px;
  box-shadow:0 6px 0 var(--wood-dark),0 10px 18px rgba(0,0,0,.4),inset 0 3px 0 rgba(255,255,255,.2);
}
.nav-home{
  background:linear-gradient(180deg,#A1887F 0%,var(--wood-main) 100%);
  border:3px solid var(--wood-dark);color:#fff;padding:8px 16px;border-radius:10px;
  font-size:15px;text-decoration:none;font-weight:900;letter-spacing:1px;
  box-shadow:0 4px 0 var(--wood-dark);text-shadow:1px 1px 0 #000;transition:all .1s;
  display:flex;align-items:center;gap:8px;
}
.nav-home svg{width:16px;height:16px}
.nav-home:hover{filter:brightness(1.1)}
.nav-home:active{transform:translateY(4px);box-shadow:0 0 0 var(--wood-dark)}
.nav-title{
  font-size:19px;font-weight:900;letter-spacing:2px;color:var(--gold-text);
  text-shadow:2px 2px 0 #000;margin-left:4px;
}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nav-btn{
  width:44px;height:44px;border-radius:10px;border:3px solid var(--wood-dark);
  background:rgba(0,0,0,.28);cursor:pointer;font-size:20px;line-height:1;
  box-shadow:0 3px 0 var(--wood-dark);transition:.15s;
}
.nav-btn:hover{filter:brightness(1.2)}
.nav-btn:active{transform:translateY(3px);box-shadow:none}
#sound-btn .off{display:none}
#sound-btn.muted .on{display:none}
#sound-btn.muted .off{display:inline}
.pill{
  display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:12px;
  font-weight:900;font-size:16px;text-shadow:1px 1px 0 #000;
  background:rgba(0,0,0,.35);transition:transform .15s;
}
.pill .p-lbl{font-size:11px;letter-spacing:1px;color:rgba(255,255,255,.75)}
.pill.money{border:3px solid var(--gold-text);color:var(--gold-text)}
.pill.rice{border:3px solid #81C784;color:#81C784}
.pill.bump{transform:scale(1.08)}
/* toolbar công cụ */
.toolbar{display:flex;flex-wrap:wrap;justify-content:center;gap:15px;margin-bottom:22px;background:rgba(0,0,0,.25);padding:10px 20px;border-radius:15px}
.tool-btn{
  background:linear-gradient(180deg,#A1887F 0%,var(--wood-main) 100%);border:3px solid var(--wood-dark);
  color:#fff;font-size:16px;font-weight:700;padding:10px 20px;border-radius:10px;cursor:pointer;
  transition:all .1s;font-family:'Quicksand',sans-serif;display:flex;align-items:center;gap:8px;
  box-shadow:0 4px 0 var(--wood-dark),0 5px 10px rgba(0,0,0,.3);text-shadow:1px 1px 0 #000;
}
.tool-btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--wood-dark)}
.tool-btn.active{background:linear-gradient(180deg,#FFF59D 0%,#FBC02D 100%);color:#3E2723;border-color:#F57F17;box-shadow:0 4px 0 #F57F17;text-shadow:1px 1px 0 rgba(255,255,255,.5);transform:translateY(-2px)}
/* khu ruộng */
.farm-wrapper{display:flex;width:95%;max-width:1400px;justify-content:center;gap:25px;align-items:flex-start;cursor:default}
.farm-grid{flex:2;max-width:900px;display:grid;grid-template-columns:repeat(10,1fr);gap:6px;position:relative;z-index:5}
.right-panel{width:320px;display:flex;flex-direction:column;gap:15px;pointer-events:auto}
.panel-box{
  background:linear-gradient(180deg,var(--wood-light) 0%,var(--wood-main) 100%);
  border:4px solid var(--wood-dark);border-radius:15px;padding:15px;
  box-shadow:0 8px 10px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.2);
  display:flex;flex-direction:column;align-items:center;position:relative;
}
.panel-title{font-size:18px;font-weight:900;color:var(--gold-text);text-shadow:2px 2px 0 #000;margin-bottom:12px;border-bottom:2px dashed #8D6E63;padding-bottom:8px;width:100%;text-align:center}
/* nông dân NPC */
.merchant-area{display:flex;flex-direction:column;align-items:center;width:100%;position:relative}
.merchant{font-size:80px;cursor:pointer;display:flex;flex-direction:column;align-items:center;filter:drop-shadow(3px 5px 5px rgba(0,0,0,.5));transition:transform .15s ease;margin-bottom:10px}
.merchant:hover{filter:drop-shadow(0 0 15px #FFF);transform:scale(1.05)}
.merchant::after{content:"NÔNG DÂN";font-size:14px;background:var(--wood-main);color:#fff;padding:4px 10px;border-radius:10px;font-weight:900;margin-top:-5px;border:2px solid #FFD54F;box-shadow:0 4px 6px rgba(0,0,0,.4);text-shadow:1px 1px 0 #000}
.speech-bubble{
  position:absolute;top:-60px;left:50%;transform:translateX(-50%) translateY(10px);
  background:#FFF;color:#333;padding:12px 15px;border-radius:12px;
  font-size:14px;font-weight:900;text-align:center;width:220px;line-height:1.4;
  opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.175,.885,.32,1.275);
  box-shadow:0 6px 12px rgba(0,0,0,.4);z-index:100;
}
.speech-bubble.show{opacity:1;transform:translateX(-50%) translateY(0)}
.speech-bubble::after{content:'';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);border-width:10px 10px 0;border-style:solid;border-color:#FFF transparent transparent transparent}
.sell-actions{display:flex;width:100%;margin-top:10px}
.btn-sell-all{
  flex:1;background:linear-gradient(180deg,#F44336 0%,#C62828 100%);
  border:2px solid #FFF;color:white;font-weight:900;font-size:16px;
  padding:12px 5px;border-radius:8px;cursor:pointer;text-shadow:1px 1px 0 #000;
  font-family:'Quicksand',sans-serif;transition:all .1s;
  box-shadow:0 4px 0 #8e0000,0 5px 10px rgba(0,0,0,.5);
}
.btn-sell-all:active{transform:translateY(4px);box-shadow:0 0 0 rgba(0,0,0,.5)}
.btn-sell-all:hover{filter:brightness(1.1)}
/* nhật ký */
.log-container{background:rgba(0,0,0,.4);width:100%;height:180px;border-radius:10px;border:2px inset var(--wood-dark);overflow-y:auto;padding:8px;box-sizing:border-box;display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}
.log-container::-webkit-scrollbar{width:6px}
.log-container::-webkit-scrollbar-thumb{background:var(--wood-main);border-radius:3px}
.log-entry{animation:fadeIn .3s;text-shadow:1px 1px 0 #000}
.log-time{color:#9E9E9E;font-size:11px;margin-right:4px}
/* ô ruộng */
.plot{
  background-color:var(--soil-empty);border:4px solid #795548;border-bottom-width:6px;
  border-radius:12px;position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;transition:all .3s;
  box-shadow:inset 0 5px 10px rgba(0,0,0,.4);pointer-events:auto;
  min-height:80px;cursor:pointer;
}
.plot:hover{filter:brightness(1.1);transform:scale(1.02)}
.plot.is-fertilized{background-color:var(--soil-fertilized);border-color:#4e342e}
.plot.is-growing{background-color:var(--soil-wet);border-color:#21120c}
.plot.is-mature{background-color:var(--soil-mature);border-color:#F57F17;box-shadow:inset 0 5px 10px rgba(255,255,255,.4),0 0 15px rgba(251,192,45,.6);animation:pulse-glow 2s infinite}
.emoji{font-size:40px;z-index:2;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));animation:pop-in .4s cubic-bezier(.175,.885,.32,1.275)}
.water-req{position:absolute;top:-15px;right:0;font-size:28px;z-index:10;display:none;filter:drop-shadow(2px 2px 3px rgba(0,0,0,.5));animation:floatBubble .8s infinite alternate ease-in-out;pointer-events:none}
.progress-bar{height:100%;width:0%;background:linear-gradient(90deg,#4CAF50,#81C784);transition:width 1s linear;border-radius:3px}
.progress-container{position:absolute;bottom:-10px;left:10%;width:80%;height:10px;background:#212121;border-radius:5px;display:none;overflow:hidden;border:2px solid #FFF;box-shadow:0 2px 4px rgba(0,0,0,.5);z-index:3}
@keyframes pulse-glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.2)}}
@keyframes pop-in{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes floatBubble{0%{transform:translateY(0)}100%{transform:translateY(-10px)}}
@keyframes fadeIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
/* cursor & chữ bay */
#custom-cursor{position:fixed;pointer-events:none;font-size:50px;z-index:9999;display:none;transform:translate(-30%,-80%);filter:drop-shadow(2px 4px 6px rgba(0,0,0,.5));transition:transform .05s linear}
.floating-text{position:absolute;font-weight:900;pointer-events:none;z-index:9999;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;animation:floatUp 1.2s cubic-bezier(.25,1,.5,1) forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.5)}20%{transform:translateY(-20px) scale(1.2)}100%{opacity:0;transform:translateY(-80px) scale(1)}}
/* nổ hũ */
.jackpot-huge{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:100px;font-weight:900;z-index:10000;pointer-events:none;display:none;
  text-align:center;line-height:1.1;font-family:'Quicksand',sans-serif;
  background:linear-gradient(180deg,#FFFDE7 0%,#FFD54F 40%,#FF8F00 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;-webkit-text-stroke:4px #b71c1c;
  filter:drop-shadow(0 10px 20px rgba(0,0,0,.8)) drop-shadow(0 0 30px #FF9800);
}
@keyframes jackpotPulse{
  0%{transform:translate(-50%,-50%) scale(.2);opacity:0}
  5%{transform:translate(-50%,-50%) scale(1.1);opacity:1}
  10%{transform:translate(-50%,-50%) scale(1);opacity:1}
  90%{transform:translate(-50%,-50%) scale(1);opacity:1}
  100%{transform:translate(-50%,-50%) scale(1.5);opacity:0}
}
.shake-active{animation:earthquake .1s 10;overflow:hidden}
@keyframes earthquake{0%,100%{transform:translate(0,0)}25%{transform:translate(-5px,5px)}75%{transform:translate(5px,-5px)}}
/* responsive */
@media(max-width:1000px){
  .nav-title{display:none}
  .farm-wrapper{flex-direction:column;align-items:center}
  .right-panel{width:100%;max-width:660px}
}
@media(max-width:700px){
  .farm-grid{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>
<body>

<div id="custom-cursor">🛍️</div>
<div class="jackpot-huge" id="jackpot-text">NỔ HŨ<br>x10</div>

<!-- ============ HUB ============ -->
<nav class="navbar">
  <a href="index.html" class="nav-home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5m6-7-7 7 7 7"/></svg>
    TRANG CHỦ
  </a>
  <div class="nav-title">NÔNG TRẠI ĐỒNG QUÊ</div>
  <div class="nav-right">
    <button class="nav-btn" id="sound-btn" title="Âm thanh">
      <span class="on">🔊</span><span class="off">🔇</span>
    </button>
    <div class="pill money" id="money-pill">
      <span>💰</span>
      <span><span class="p-lbl">VÍ</span><br><span id="money-display">5.000.000</span> VNĐ</span>
    </div>
    <div class="pill rice" id="rice-pill">
      <span>🌾</span>
      <span><span class="p-lbl">KHO</span><br><span id="rice-display">0</span> GẠO</span>
    </div>
  </div>
</nav>

<!-- ============ CÔNG CỤ ============ -->
<div class="toolbar">
  <button class="tool-btn active" data-tool="fertilizer" data-icon="🛍️">🛍️ Phân Bón</button>
  <button class="tool-btn" data-tool="seed" data-icon="🌱">🌱 Hạt Giống</button>
  <button class="tool-btn" data-tool="water" data-icon="💦">💦 Bình Tưới</button>
  <button class="tool-btn" data-tool="sickle" data-icon="🪓">🪓 Lưỡi Liềm</button>
</div>

<!-- ============ RUỘNG + PANEL ============ -->
<div class="farm-wrapper" id="farm-area">
  <div class="farm-grid" id="farm"></div>

  <div class="right-panel">
    <div class="panel-box">
      <div class="merchant-area">
        <div class="speech-bubble" id="npc-quote">Làm nông vui vẻ!</div>
        <div class="merchant" id="npc-farmer">👨‍🌾</div>
        <div class="sell-actions">
          <button class="btn-sell-all" id="btn-sell">💰 BÁN TẤT CẢ GẠO KHO</button>
        </div>
      </div>
    </div>

    <div class="panel-box" style="flex-grow:1">
      <div class="panel-title">📜 NHẬT KÝ NÔNG TRẠI</div>
      <div class="log-container" id="game-log">
        <div class="log-entry"><span class="log-time">[Hệ thống]</span> <span style="color:#FFF">Chào mừng đến với Nông Trại Đồng Quê!</span></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ============ VÍ TIỀN CHUNG (key "userBalance" — liên kết mọi trang) ============ */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const fmt = n => Math.round(n).toLocaleString('vi-VN');
const wallet = {
  bal: 0, shown: 0, anim: null, el: $('#money-display'),
  load(){
    const v = parseInt(String(localStorage.getItem('userBalance')||'').replace(/[.,\s]/g,''));
    this.bal = isNaN(v) ? 5000000 : v; this.render();
  },
  render(){ this.el.textContent = fmt(this.bal); this.shown = this.bal },
  set(v){
    this.bal = Math.max(0, Math.round(v));
    localStorage.setItem('userBalance', this.bal);
    if(this.anim) cancelAnimationFrame(this.anim);
    const from = this.shown, to = this.bal, t0 = performance.now();
    const bump = $('#money-pill');
    bump.classList.add('bump'); setTimeout(()=>bump.classList.remove('bump'), 160);
    const step = t => { const p = Math.min(1,(t-t0)/650), e = 1-Math.pow(1-p,3);
      this.shown = Math.round(from+(to-from)*e); this.el.textContent = fmt(this.shown);
      if(p<1) this.anim = requestAnimationFrame(step); else this.anim = null };
    this.anim = requestAnimationFrame(step);
  },
  add(v){ this.set(this.bal + v) }
};
wallet.load();
addEventListener('storage', e => { if(e.key === 'userBalance') wallet.load() });

/* ============ ÂM THANH ĐỒNG QUÊ (WebAudio, chung khóa "muted") ============ */
const sound = {
  muted: localStorage.getItem('muted') === '1', ctx: null,
  ac(){ try{
    if(!this.ctx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; this.ctx = new C() }
    if(this.ctx.state === 'suspended'){ this.ctx.resume().catch(()=>{}) }
    return this.ctx;
  }catch(e){ return null } },
  tone(f, dur=.1, type='sine', vol=.06, when=0, slide=0){
    if(this.muted) return; const c = this.ac(); if(!c) return;
    try{
      const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f+slide), t+dur);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t+.012);
      g.gain.exponentialRampToValueAtTime(.0001, t+dur);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05);
    }catch(e){}
  },
  dig(){ this.tone(150,.1,'triangle',.06,0,-60); this.tone(110,.08,'triangle',.05,.09,-40) },
  seed(){ this.tone(1250,.04,'triangle',.04); this.tone(1650,.04,'triangle',.035,.06) },
  water(){ this.tone(900,.22,'sine',.05,0,-520) },
  harvest(){ this.tone(700,.05,'triangle',.05); this.tone(1050,.09,'triangle',.05,.06) },
  bad(){ this.tone(220,.16,'square',.04,0,-90) },
  click(){ this.tone(720,.05,'triangle',.05) },
  coin(){ [880,1170,1560].forEach((f,i)=>this.tone(f,.09,'triangle',.05,i*.06)) },
  jackpot(){ [392,523,659,784,1046,1318].forEach((f,i)=>this.tone(f,.16,'sine',.07,i*.09));
    for(let i=0;i<10;i++) this.tone(1600+Math.random()*700,.05,'triangle',.035,.6+Math.random()*.8) }
};
function syncSndBtn(){ $('#sound-btn').classList.toggle('muted', sound.muted) }
syncSndBtn();
 $('#sound-btn').addEventListener('click', () => {
  sound.muted = !sound.muted;
  try{ localStorage.setItem('muted', sound.muted ? '1' : '0') }catch(e){}
  syncSndBtn();
  if(!sound.muted) sound.click();
});
addEventListener('storage', e => {
  if(e.key === 'muted'){ sound.muted = e.newValue === '1'; syncSndBtn() }
});

/* ============ TRẠNG THÁI GAME ============ */
let rice = 0, currentTool = 'fertilizer', isHoldingMouse = false;
const BASE_PRICE = 100000;
const plots = Array.from({length: 80}, (_, i) => ({ id: i, state: 'empty', timer: null }));

const npcQuotes = [
  "Lao động là vinh quang, lang thang là chết đói!",
  "Có làm thì mới có ăn, không dưng ai dễ đem phần đến cho.",
  "Thức khuya dậy sớm kiếm tiền, ráng trồng lúa tốt vợ hiền mới thương.",
  "Nắng mưa là chuyện của trời, cấy cày là chuyện của đời nông phu.",
  "Trồng lúa sướng lắm... là lúc nổ hũ x10 thôi!",
  "Bàn tay ta làm nên tất cả, có sức người sỏi đá cũng thành cơm.",
  "Đừng vì lười biếng hôm nay mà ngày mai cạp đất mà ăn con ạ!",
  "Khổ trước sướng sau thế mới giàu, gặt lúa đi đừng lướt TopTop nữa.",
  "Thất bại là mẹ thành công, lúa chết thì trồng lại lo gì!",
  "Mồ hôi rơi ướt cả ruộng đồng, thu hoạch một phát rủng rỉnh tiền tiêu."
];
let quoteTimeout = null;

/* ============ NPC ============ */
 $('#npc-farmer').addEventListener('click', () => {
  currentTool = null;
  $$('.tool-btn').forEach(b => b.classList.remove('active'));
  $('#custom-cursor').style.display = 'none';
  const bubble = $('#npc-quote');
  bubble.innerText = npcQuotes[Math.floor(Math.random() * npcQuotes.length)];
  bubble.classList.add('show');
  sound.click();
  if(quoteTimeout) clearTimeout(quoteTimeout);
  quoteTimeout = setTimeout(() => bubble.classList.remove('show'), 5000);
});

/* ============ NHẬT KÝ ============ */
function addLog(message, color = "#FFFFFF"){
  const logBox = $('#game-log');
  const entry = document.createElement('div'); entry.className = 'log-entry';
  const now = new Date();
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  entry.innerHTML = `<span class="log-time">[${timeStr}]</span> <span style="color:${color}">${message}</span>`;
  logBox.appendChild(entry);
  if(logBox.children.length > 30) logBox.removeChild(logBox.firstChild);
  logBox.scrollTop = logBox.scrollHeight;
}

/* ============ CHỌN CÔNG CỤ (ấn 1 lần chọn, lần 2 bỏ) ============ */
 $$('.tool-btn').forEach(btn => btn.addEventListener('click', () => {
  const tool = btn.dataset.tool, icon = btn.dataset.icon;
  const cc = $('#custom-cursor');
  if(currentTool === tool){
    currentTool = null;
    btn.classList.remove('active');
    cc.style.display = 'none';
  } else {
    currentTool = tool;
    $$('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    cc.innerText = icon;
    cc.style.display = 'block';
  }
  sound.click();
}));

document.addEventListener('mousemove', e => {
  if(!currentTool) return;
  const cc = $('#custom-cursor');
  cc.style.left = e.clientX + 'px'; cc.style.top = e.clientY + 'px';
});
const farmArea = $('#farm-area');
farmArea.addEventListener('mouseenter', () => { if(currentTool) $('#custom-cursor').style.display = 'block' });
farmArea.addEventListener('mouseleave', () => { $('#custom-cursor').style.display = 'none'; isHoldingMouse = false });
document.addEventListener('mousedown', () => {
  if(currentTool) $('#custom-cursor').style.transform = 'translate(-30%,-80%) scale(.8) rotate(-15deg)';
  isHoldingMouse = true;
});
document.addEventListener('mouseup', () => {
  if(currentTool) $('#custom-cursor').style.transform = 'translate(-30%,-80%) scale(1) rotate(0deg)';
  isHoldingMouse = false;
});

/* ============ CHỮ BAY ============ */
function spawnFloatingText(x, y, text, color, fontSize = '24px'){
  const span = document.createElement('span');
  span.className = 'floating-text'; span.innerText = text;
  span.style.left = x + 'px'; span.style.top = y + 'px';
  span.style.color = color; span.style.fontSize = fontSize;
  document.body.appendChild(span);
  setTimeout(() => span.remove(), 1200);
}

/* ============ KHỞI TẠO RUỘNG ============ */
function initFarm(){
  const farmDiv = $('#farm');
  plots.forEach(p => {
    const d = document.createElement('div');
    d.id = `plot-${p.id}`; d.className = 'plot';
    d.addEventListener('mousedown', e => interact(e, p.id));
    d.addEventListener('mouseenter', e => { if(isHoldingMouse) interact(e, p.id) });
    d.innerHTML = `<div class="water-req" id="wq-${p.id}">💧</div><div class="emoji" id="em-${p.id}"></div><div class="progress-container" id="pc-${p.id}"><div class="progress-bar" id="pb-${p.id}"></div></div>`;
    farmDiv.appendChild(d);
  });
  updateRice();
  if(currentTool) $('#custom-cursor').style.display = 'block';
}

/* ============ TƯƠNG TÁC RUỘNG (giữ nguyên luật gốc) ============ */
function interact(event, id){
  if(!currentTool) return;
  const p = plots[id], d = document.getElementById(`plot-${id}`);
  const em = document.getElementById(`em-${id}`), wq = document.getElementById(`wq-${id}`);
  em.style.animation = 'none'; void em.offsetHeight; em.style.animation = null;

  if(currentTool === 'fertilizer' && p.state === 'empty'){
    p.state = 'fert'; d.classList.add('is-fertilized');
    sound.dig();
    spawnFloatingText(event.clientX, event.clientY, "🛍️ Bón phân", "#A1887F", "20px");
  }
  else if(currentTool === 'seed' && p.state === 'fert'){
    p.state = 'seed'; em.innerText = '🌱';
    sound.seed();
    spawnFloatingText(event.clientX, event.clientY, "-1 🌱", "#FF5722", "20px");
    const waterDelay = Math.floor(Math.random() * 3 + 6) * 1000;
    setTimeout(() => { if(p.state === 'seed'){ p.state = 'water'; wq.style.display = 'block' } }, waterDelay);
  }
  else if(currentTool === 'water' && p.state === 'water'){
    const deathChance = 0.08;
    if(Math.random() < deathChance){
      p.state = 'empty'; d.className = 'plot'; em.innerText = '❌'; wq.style.display = 'none';
      sound.bad();
      spawnFloatingText(event.clientX, event.clientY, "Cây chết!", "#F44336", "24px");
      addLog("❌ Một cây lúa vừa chết khô!", "#F44336");
      setTimeout(() => em.innerText = '', 1000);
    } else {
      p.state = 'grow'; d.classList.add('is-growing'); wq.style.display = 'none';
      document.getElementById(`pc-${id}`).style.display = 'block';
      sound.water();
      spawnFloatingText(event.clientX, event.clientY, "💦 Đã tưới", "#29B6F6", "20px");
      const bar = document.getElementById(`pb-${id}`);
      let w = 0;
      const totalSeconds = Math.floor(Math.random() * 11) + 30;
      const stepSize = 100 / totalSeconds;
      p.timer = setInterval(() => {
        w += stepSize; bar.style.width = w + '%';
        if(w >= 100){
          clearInterval(p.timer);
          p.state = 'mature'; d.className = 'plot is-mature'; em.innerText = '🌾';
          document.getElementById(`pc-${id}`).style.display = 'none';
        }
      }, 1000);
    }
  }
  else if(currentTool === 'sickle' && p.state === 'mature'){
    p.state = 'empty'; d.className = 'plot'; em.innerText = '';
    rice += 1; updateRice();
    sound.harvest();
    spawnFloatingText(event.clientX, event.clientY, "+1 🌾", "#81C784", "30px");
    addLog("🌾 Đã thu hoạch +1 Gạo.", "#81C784");
  }
}

function updateRice(){
  $('#rice-display').textContent = rice;
  const pill = $('#rice-pill');
  pill.classList.add('bump'); setTimeout(() => pill.classList.remove('bump'), 160);
}

/* ============ NỔ HŨ ============ */
function triggerJackpot(){
  const jp = $('#jackpot-text');
  jp.style.display = 'block'; jp.style.animation = 'none'; void jp.offsetWidth;
  jp.style.animation = 'jackpotPulse 8s forwards';
  sound.jackpot();
  document.body.classList.add('shake-active');
  setTimeout(() => document.body.classList.remove('shake-active'), 1000);
  setTimeout(() => { jp.style.display = 'none'; jp.style.animation = 'none' }, 8000);
}

/* ============ BÁN GẠO (giữ nguyên hệ số gốc) ============ */
 $('#btn-sell').addEventListener('click', e => {
  if(rice <= 0){
    sound.bad();
    spawnFloatingText(e.clientX, e.clientY, "Kho trống trơn!", "#F44336", "24px");
    return;
  }
  const amountToSell = rice;
  let totalEarned = 0, count_x10 = 0, count_x2 = 0, count_x15 = 0, count_x1 = 0;

  for(let i = 0; i < amountToSell; i++){
    const r = Math.random(); let multi = 1;
    if(r < 0.005){ multi = 10; count_x10++ }
    else if(r < 0.05){ multi = 2; count_x2++ }
    else if(r < 0.20){ multi = 1.5; count_x15++ }
    else { count_x1++ }
    totalEarned += BASE_PRICE * multi;
  }

  rice = 0; updateRice();
  wallet.add(totalEarned);
  sound.coin();
  spawnFloatingText(e.clientX, e.clientY - 20, `+${totalEarned.toLocaleString()}💰`, "#FFD54F", "40px");
  addLog(`🛒 [BÁN SỈ] Bán ${amountToSell} Gạo thu về ${totalEarned.toLocaleString()} VNĐ!`, "#4CAF50");

  if(count_x10 > 0 || count_x2 > 0 || count_x15 > 0){
    addLog(`(Chi tiết: ${count_x10} hạt x10, ${count_x2} hạt x2, ${count_x15} hạt x1.5)`, "#BCAAA4");
  }
  if(count_x10 > 0) triggerJackpot();
});

initFarm();
</script>
</body>
</html>
